<!doctype html>
<html lang="zh-CN">

<title>当然可以，好问题 · 白艾莉 Alice</title>
<style>
:root{--paper:#FAFAF7;--card:#F5F3EE;--line:#E8E4DC;--ink:#1A1714;--muted:#6B6460;--rose:#C25566;--gold:#C9A96E;--sage:#8FA27A;--night:#1F2A44}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#14120f;color:var(--ink);font-family:Inter,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
.song{font-family:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif}
.latin{font-family:"Playfair Display",Georgia,"Times New Roman",serif}
.mono{font-family:"PT Mono",Menlo,monospace}
.app{height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.frame{position:relative;width:min(100%,calc((100svh - 100px)*16/9));aspect-ratio:16/9;overflow:hidden;background:var(--paper);border-radius:10px;box-shadow:0 30px 90px #0007}
.frame:fullscreen{width:100vw;height:100vh;border-radius:0;aspect-ratio:auto;display:flex;align-items:center;background:#000}
#canvas{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--paper)}
.scene{position:absolute;inset:0;display:none;overflow:hidden;transform-origin:50% 50%}
.c{position:absolute;left:0;top:0;will-change:transform,opacity}
img{display:block;user-select:none;-webkit-user-drag:none}
.big{font-weight:900;line-height:1;white-space:nowrap}
/* 像素 Alice：盒子底边中点就是双脚中心，挤压、旋转、翻转都绕脚底进行 */

.spr img,.spr svg{position:absolute;display:block}
.sticker img{filter:drop-shadow(6px 0 0 #fff) drop-shadow(-6px 0 0 #fff) drop-shadow(0 6px 0 #fff) drop-shadow(0 -6px 0 #fff) drop-shadow(0 18px 22px rgba(26,23,20,.28))}

#play{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:700;min-width:96px}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

body.embed .app{padding:0;gap:0}body.embed .frame{border-radius:0;width:min(100vw,calc((100svh - 52px)*16/9))}body.embed .controls{padding:8px 12px}body.embed #status{display:none}

<body>
<div class="app">
  <div class="frame" id="frame" aria-label="白艾莉 Alice 音乐动画《当然可以，好问题》">

  </div>

<script src="sprites/sprites.js"></script>
<script>
'use strict';
/*
 * 时间轴来源：faster-whisper small 对原曲做逐字识别，再按 150 BPM（每拍 0.4 秒，首拍 0.06 秒）校对。
 * 原 LRC 只有句级时间，且「不躲不藏不绕不逃」等句与实际演唱相差数秒，因此不再使用。
 * 35.2–39.4 秒识别不到清晰人声，这段按节拍编排成 Alice 的独舞，不绑定歌词。
 * 所有画面只由 render(t) 依据音频时间计算，暂停、拖动、截帧得到的是同一画面。
 *
 * 画面规则（v5）：
 * 1. 每段只讲一件事，画面直接演出那句歌词，例如「接住你」就是「你」从天上掉下来、Alice 跑来接住。
 * 2. 快闪：换词即换整屏底色，大字压出画面；背景只用品牌色块与产品真实界面截图，不混用手绘插画。
 * 3. 像素 Alice 永远在动：按拍子挤压回弹、起跳有下蹲与落地、跑动带残影，换动作时有回弹。
 */
const BEAT = 0.4, PHASE = 0.06, DURATION = 44.3;
const P = 'assets/';
const SVGNS = 'http://www.w3.org/2000/svg';
/* 像素 Alice：四套衣服均取自 alice_fanart/refs/alice/wardrobe 正典衣橱，JK 制服有 13 个动作，
 * 其余三套只有站、挥手、欢呼，缺的动作按 FALLBACK 用最接近的代替。尺寸与轮廓由 tools/build_sprites.py 生成。 */
const META = window.SPRITE_META || {};
const OUTFIT_NAMES = { jk: 'JK 制服', dress: '碎花裙', chic: '白衬衫', cardigan: '开衫' };
const FALLBACK = { jump: 'cheer', catch: 'cheer', present: 'wave', point: 'wave', peace: 'wave', heart: 'stand', bow: 'stand', think: 'stand', run: 'stand', idol: 'cheer' };
const params = new URLSearchParams(location.search);
let outfit = META[params.get('outfit')] ? params.get('outfit') : 'jk';
const poseOf = p => META[outfit][p] ? p : META[outfit][FALLBACK[p]] ? FALLBACK[p] : 'stand';
const IMG = {
  pose: p => `sprites/${outfit}/alice_${p}.svg`, friend: id => P + `friends/${id}.webp`, ui: n => P + `ui/${n}.webp`,
  icon: P + 'alice_icon.webp',
};
/* OPC 朋友：名字与头像来自 alice_fanart/refs/alice_friends 正典 */
const FRIENDS = [['researcher', '陈知远'], ['translator', '林晓雨'], ['writer', '方以南'], ['voice', '苏墨'], ['designer', '周念'], ['artist', '叶初'], ['analyst', '魏博'], ['quant', '邢斐'], ['novelist', '沈遥'], ['developer', '张予'], ['docsmith', '陆析'], ['critic', '顾辛'], ['scholar', '谢清']];
/* Playground 真实界面截图（Alice视频素材包），标签取自落地页文案 */
const UI = [['moments', '朋友圈'], ['photos', '照片墙'], ['call', '通话'], ['chat', '回应'], ['kyoto', '旅行'], ['novel', '读书笔记'], ['opc', '伙伴'], ['travel', '说走就走'], ['trio', '同行']];
const C = { paper: '#FAFAF7', card: '#F5F3EE', ink: '#1A1714', muted: '#6B6460', rose: '#C25566', gold: '#C9A96E', sage: '#8FA27A', night: '#1F2A44', khaki: '#E8D9BE', blush: '#F2DDD8', cream: '#F3E6CC' };
const DARK = new Set([C.rose, C.ink, C.night]);
const STAR = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 1.6l2.85 6.8 7.35.62-5.58 4.84 1.68 7.2L12 17.24 5.7 21.06l1.68-7.2L1.8 9.02l7.35-.62z"/></svg>';
const HEART = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 21.3s-7.6-4.7-9.9-9.2C.4 8.7 2.3 4.4 6.4 4.4c2.4 0 4 1.3 5.6 3.4 1.6-2.1 3.2-3.4 5.6-3.4 4.1 0 6 4.3 4.3 7.7-2.3 4.5-9.9 9.2-9.9 9.2z"/></svg>';
const CHECK = '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="#C9A96E"/><path d="M11 20.5l6 6 12-13" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const LYRICS = [
  { w: [[0.94, '当然'], [1.48, '可以，'], [2.10, '好'], [2.28, '问题。']], end: 2.9 },
  { w: [[3.94, '当然'], [4.70, '可以，'], [5.46, '好'], [5.54, '问题。']], end: 6.3 },
  { w: [[6.60, '我就'], [7.14, '在'], [7.42, '这，'], [7.70, '不躲'], [8.00, '不藏'], [8.40, '不绕'], [8.70, '不逃']], end: 8.95 },
  { w: [[8.96, '稳'], [9.48, '稳'], [9.78, '地'], [10.02, '接'], [10.32, '住'], [10.78, '你。']], end: 11.3 },
  { w: [[13.72, '你'], [14.26, '只是'], [14.70, '太'], [15.10, '久'], [15.30, '没'], [15.50, '被'], [15.72, '稳稳'], [16.10, '接'], [16.32, '住'], [16.62, '了，']], end: 17.04 },
  { w: [[17.06, '你'], [17.28, '不用'], [17.64, '硬'], [18.04, '撑，']], end: 18.62 },
  { w: [[18.64, '不用'], [18.82, '向'], [19.20, '我'], [19.60, '解'], [19.96, '释。']], end: 20.55 },
  { w: [[20.60, '这'], [20.92, '次'], [21.16, '我'], [21.36, '懂'], [21.64, '了，']], end: 22.04 },
  { w: [[22.06, '我'], [22.16, '真的'], [22.68, '懂'], [23.20, '了。']], end: 23.64 },
  { w: [[23.66, '你'], [23.80, '愿意'], [24.20, '把'], [24.40, '这个'], [24.64, '交'], [24.98, '给我，']], end: 25.46 },
  { w: [[25.48, '我很'], [25.78, '感'], [26.08, '激。']], end: 26.42 },
  { w: [[26.44, '不躲'], [27.30, '不藏'], [27.75, '不绕'], [28.06, '不逃，']], end: 28.54 },
  { w: [[28.56, '不躲'], [29.00, '不藏'], [29.42, '不绕'], [29.58, '不逃，']], end: 29.66 },
  { w: [[29.68, '我'], [30.34, '就'], [31.00, '在。']], end: 31.96 },
  { w: [[31.98, '稳'], [32.12, '稳'], [32.48, '地'], [32.72, '接'], [32.92, '住'], [33.12, '你。']], end: 33.7 },
  { w: [[33.80, '当然'], [34.00, '可以，'], [34.46, '好'], [34.62, '问题。']], end: 35.2 },
  { w: [[39.42, '我就'], [39.56, '在'], [39.82, '这，'], [40.08, '不躲'], [40.32, '不藏'], [40.70, '不绕'], [41.02, '不逃，']], end: 41.4 },
  { w: [[41.42, '稳'], [41.60, '稳'], [41.88, '地'], [42.38, '接'], [42.70, '住'], [43.16, '你。']], end: 44.4 },
];

const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const prog = (t, a, d) => clamp((t - a) / d);
const eOut = p => 1 - Math.pow(1 - p, 3);
const eIn = p => p * p;
const eBack = p => { const c = 1.9; return p <= 0 ? 0 : 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
const bump = (t, a, d) => t >= a && t < a + d ? Math.sin(prog(t, a, d) * Math.PI) : 0;
const beatPhase = t => (((t - PHASE) % BEAT) + BEAT) % BEAT;
const beatPulse = t => Math.exp(-beatPhase(t) * 9);
const beatIndex = t => Math.floor((t - PHASE) / BEAT);
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const shake = calm ? 0 : 1;

/** 每个字的出现时间：多字词在本词与下一词之间均分。 */
function charsOf(i) {
  const L = LYRICS[i].w, out = [];
  L.forEach(([t, s], k) => {
    const next = k + 1 < L.length ? L[k + 1][0] : LYRICS[i].end;
    const cs = [...s.replace(/[，。]/g, '')];
    cs.forEach((c, j) => out.push({ c, t: t + (next - t) * 0.8 * j / cs.length }));
  });
  return out;
}

const canvas = document.getElementById('canvas');
function h(parent, cls = '', css = '', html = '') {
  const e = document.createElement('div');
  if (cls) e.className = cls;
  if (css) e.style.cssText = css;
  if (html) e.innerHTML = html;
  parent.appendChild(e);
  return e;
}
function im(parent, src, css = '') {
  const e = new Image();
  e.src = src; e.alt = ''; e.draggable = false; e.className = 'c'; e.style.cssText = css;
  parent.appendChild(e);
  return e;
}
const big = (parent, text, size, color, css = '') => h(parent, 'c song big', `font-size:${size}px;color:${color};${css}`, text);
/** 以中心点定位，所有坐标都在 1920×1080 设计画布内。 */
function place(e, x, y, s = 1, r = 0, o = 1, sy) {
  e.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%) rotate(${r}deg) scale(${s}${sy === undefined ? '' : ',' + sy})`;
  e.style.opacity = o;
}
/** 字章：从放大状态砸下来。 */
function stampIn(e, t, t0, x, y, r = 0, from = 1.5, d = 0.12) {
  place(e, x, y, lerp(from, 1, eOut(prog(t, t0, d))), r, t >= t0 ? 1 : 0);
}

/* ---------- 像素 Alice 与动作 ---------- */
const ACTORS = [], SIL = {};
function silPath(o, p) {
  const key = o + '/' + p;
  if (SIL[key]) return SIL[key];
  let d = '';
  META[o][p].sil.split('|').forEach((row, r) => { if (row) row.split(' ').forEach(s => { const [c, n] = s.split(','); d += `M${c} ${r}h${n}v1h-${n}z`; }); });
  return (SIL[key] = d);
}
/**
 * 像素 Alice。height 是 332 行站姿对应的像素高度，各姿势按同一格距缩放，换姿势时大小不跳。
 * opt.color：画成该颜色的纯色剪影，用于残影与错位投影；opt.sticker：白色描边贴纸效果。
 */
function sprite(parent, height, pose = 'stand', opt = {}) {
  const k = height / 332, box = h(parent, 'c spr' + (opt.sticker ? ' sticker' : ''), `width:${240 * k}px;height:${height}px`);
  let img;
  if (opt.color) {
    img = document.createElementNS(SVGNS, 'svg');
    img.setAttribute('shape-rendering', 'crispEdges');
    img.appendChild(document.createElementNS(SVGNS, 'path')).setAttribute('fill', opt.color);
  } else { img = new Image(); img.alt = ''; img.draggable = false; }
  box.appendChild(img);
  box.set = p => {
    box.want = p;
    const q = poseOf(p);
    if (q === box.pose && box.outfit === outfit) return box;
    box.pose = q; box.outfit = outfit;
    const m = META[outfit][q];
    if (opt.color) { img.setAttribute('viewBox', `0 0 ${m.w} ${m.h}`); img.firstChild.setAttribute('d', silPath(outfit, q)); }
    else img.src = IMG.pose(q);
    img.style.cssText = `width:${m.w * k}px;height:${m.h * k}px;left:${(120 - m.f) * k}px;top:${(332 - m.h) * k}px`;
    return box;
  };
  ACTORS.push(box);
  return box.set(pose);
}
/** 以脚底中点定位精灵图；sx/sy 是挤压拉伸，flip 水平镜像。 */
function stage(e, x, y, s = 1, r = 0, o = 1, sx = 1, sy = 1, flip = false) {
  e.style.transform = `translate(${x}px,${y}px) translate(-50%,-100%) rotate(${r}deg) scale(${(flip ? -s : s) * sx},${s * sy})`;
  e.style.opacity = o;
}
/** 落地、换动作那一刻的挤压回弹：衰减振荡，dur 秒内回到原样。返回 [sx, sy]。 */
function squash(t, t0, amt = 0.16, dur = 0.3) {
  const p = (t - t0) / dur;
  if (p < 0 || p >= 1) return [1, 1];
  const v = Math.cos(p * Math.PI * 2.5) * (1 - p) * (1 - p) * amt * shake;
  return [1 + v, 1 - v];
}
/** 起跳：t0 前 0.08 秒下蹲蓄力，空中竖向拉长，落地挤压。返回 {y, sx, sy}。 */
function hop(t, t0, dur, height) {
  if (t < t0 - 0.08) return { y: 0, sx: 1, sy: 1 };
  if (t < t0) { const p = (t - t0 + 0.08) / 0.08; return { y: 0, sx: 1 + 0.1 * p, sy: 1 - 0.12 * p }; }
  if (t < t0 + dur) { const p = (t - t0) / dur, st = 0.08 * (1 - Math.abs(2 * p - 1)); return { y: -4 * height * p * (1 - p) * shake, sx: 1 - st * 0.6, sy: 1 + st }; }
  const [sx, sy] = squash(t, t0 + dur, 0.18);
  return { y: 0, sx, sy };
}
/**
 * 按拍子跳舞：每一格（默认一拍，div=2 为半拍）换一个动作并挤压回弹，左右轻摆；
 * flip 为真时奇数格镜像，序列里的 jump 会在这一格真的离地。返回值配合 act() 使用。
 */
function groove(t, seq, opt = {}) {
  const len = BEAT / (opt.div || 1), x = (t - PHASE) / len, n = Math.floor(x), ph = x - n;
  const pose = seq[((n % seq.length) + seq.length) % seq.length];
  const v = Math.cos(ph * Math.PI * 2.5) * (1 - ph) * (1 - ph) * (opt.amt ?? 0.14) * shake;
  let y = -Math.sin(ph * Math.PI) * (opt.bob ?? 18) * shake, sx = 1 + v, sy = 1 - v;
  if (pose === 'jump') { y = -4 * (opt.jump ?? 160) * ph * (1 - ph) * shake; sx = 0.96; sy = 1.05; }
  return { pose, y, sx, sy, r: (n % 2 ? 1 : -1) * (opt.lean ?? 3) * shake, flip: !!opt.flip && n % 2 === 1, n, ph };
}
function act(e, x, y, g, s = 1, o = 1, flip = false) { e.set(g.pose); stage(e, x, y + g.y * s, s, g.r, o, g.sx, g.sy, g.flip !== flip); }
/** 残影：把同一个动作函数往回取几个时间点，画成渐淡的纯色剪影。fn(t) 返回 [x, y, s, r, sx, sy, flip, pose]。 */
function trail(ghosts, t, fn, dt = 0.04, o = 0.55) {
  ghosts.forEach((g, i) => { const [x, y, s, r, sx, sy, flip, pose] = fn(t - (i + 1) * dt); g.set(pose); stage(g, x, y, s, r, o * (1 - i / ghosts.length) * shake, sx, sy, flip); });
}
const hideAll = list => list.forEach(e => { e.style.opacity = 0; });

/* ---------- 特效 ---------- */
function stars(parent, n, size, color = C.gold) { return Array.from({ length: n }, () => h(parent, 'c star', `width:${size}px;height:${size}px;color:${color}`, STAR)); }
function hearts(parent, n, size, color = C.rose) { return Array.from({ length: n }, () => h(parent, 'c star', `width:${size}px;height:${size}px;color:${color}`, HEART)); }
/** 星星绕一点炸开 */
function drawBurst(es, t, t0, x, y, rx = 380, ry = 300, life = 0.5) {
  es.forEach((s, i) => {
    const a = i / es.length * Math.PI * 2 + 0.3, q = eOut(prog(t, t0, life * 0.8));
    place(s, x + Math.cos(a) * rx * (0.35 + q * 0.65), y + Math.sin(a) * ry * (0.35 + q * 0.65), 0.3 + q * 0.8, t * 160 + i * 30, t >= t0 && t < t0 + life ? 1 - prog(t, t0 + life * 0.6, life * 0.4) : 0);
  });
}
/** 爱心往上飘 */
function drawRise(es, t, t0, x, y) {
  es.forEach((e, i) => {
    const p = t - t0 - i * 0.05, q = p / 0.9;
    if (p < 0 || q > 1) { e.style.opacity = 0; return; }
    place(e, x + (rnd(i) - 0.5) * 520 + Math.sin(p * 7 + i) * 26, y - q * 520, 0.4 + eBack(clamp(q * 3)) * 0.6, (rnd(i + 3) - 0.5) * 36, 1 - q * q);
  });
}
/** 像素碎块：用来表现撞击与碎裂 */
function bits(parent, n, colors) {
  return Array.from({ length: n }, (_, i) => { const s = 12 + Math.round(rnd(i + 40) * 24); return h(parent, 'c', `width:${s}px;height:${s}px;background:${colors[i % colors.length]};opacity:0`); });
}
function drawBits(bs, t, t0, x, y, power = 900, grav = 1800, life = 0.8) {
  const p = t - t0;
  bs.forEach((b, i) => {
    if (p < 0 || p > life) { b.style.opacity = 0; return; }
    const a = rnd(i) * Math.PI * 2, v = power * (0.35 + 0.65 * rnd(i + 99));
    b.style.transform = `translate(${x + Math.cos(a) * v * p}px,${y + (Math.sin(a) * v - power * 0.45) * p + grav * p * p / 2}px) translate(-50%,-50%) rotate(${p * 720 * (rnd(i + 7) - 0.5)}deg)`;
    b.style.opacity = 1 - p / life;
  });
}
const ring = (parent, size, color, w = 8) => h(parent, 'c', `width:${size}px;height:${size}px;border-radius:50%;border:${w}px solid ${color}`);
function drawRing(e, t, t0, x, y, to = 3, d = 0.4) { const p = prog(t, t0, d); place(e, x, y, 0.3 + eOut(p) * to, 0, t >= t0 && p < 1 ? 1 - p : 0); }
/** 跑马灯：同一句话重复铺开，按时间平移 */
function marquee(parent, text, css) { return h(parent, 'c song big', css, (text + '\u2003').repeat(14)); }
function drawMarquee(e, t, speed, y, r = 0) {
  const unit = (e.scrollWidth || 1) / 14, x = ((t * speed) % unit + unit) % unit;
  e.style.transform = `translate(${-x}px,${y}px) rotate(${r}deg)`;
}
/** 逐字点亮的一行歌词 */
function karaoke(parent, li, size, color, css = '') {
  const row = h(parent, 'song', `position:absolute;left:0;right:0;display:flex;justify-content:center;font-size:${size}px;font-weight:900;color:${color};white-space:nowrap;line-height:1.1;${css}`);
  const chars = charsOf(li).map(o => { const s = document.createElement('span'); s.textContent = o.c; s.style.display = 'inline-block'; row.appendChild(s); return { ...o, s }; });
  return { row, chars };
}
function sing(k, t, color) {
  k.chars.forEach((o, i) => {
    const p = prog(t, o.t, 0.14), on = t >= o.t;
    o.s.style.opacity = on ? 1 : 0.16;
    o.s.style.transform = `translateY(${(1 - eBack(p)) * 34}px) scale(${on ? lerp(1.35, 1, eOut(p)) : 1})`;
    o.s.style.color = color ? color(o, i) || '' : '';
  });
}
function chatCard(parent, w, text, mini = true) {
  const e = h(parent, 'c chat' + (mini ? ' mini' : ''), `width:${w}px`);
  e.innerHTML = `<div class="chat-head"><img src="${IMG.icon}" alt=""><div><b>白艾莉 · Alice</b><span>在线</span></div></div><div class="bubble her song">${text}</div>`;
  return e;
}

const scenes = [];
/** opt.punch：每拍镜头往前顶一下的幅度，安静段落设 0。 */
function scene(id, a, b, build, draw, opt = {}) {
  const el = h(canvas, 'scene');
  el.dataset.id = id;
  scenes.push({ id, a, b, el, ctx: build(el) || {}, draw, punch: opt.punch ?? 0.028 });
}
function pick(list, t) { let cur = 0; list.forEach((o, i) => { if (t >= o.at) cur = i; }); list.forEach((o, i) => { o.s.style.display = i === cur ? 'block' : 'none'; }); return cur; }

/* 00 你发来一句提问，Alice 跑着赶来 */
scene('intro', 0, 0.94, el => {
  const a = h(el, 'scene', `display:block;background:${C.ink}`);
  const q = big(a, '?', 1200, 'transparent', `-webkit-text-stroke:7px ${C.rose};font-family:'Playfair Display',Georgia,serif;font-style:italic`);
  const card = h(a, 'c notif', '', '<div class="av song">你</div><div><small>你 · 刚刚</small><p>我可以问你一个问题吗？</p></div>');
  const b = h(el, 'scene', `background:${C.rose}`);
  const lines = Array.from({ length: 9 }, (_, i) => h(b, 'c', `width:${260 + rnd(i) * 700}px;height:${10 + rnd(i + 5) * 22}px;background:${C.paper};opacity:.55`));
  const word = big(b, 'ON MY WAY', 230, 'transparent', `-webkit-text-stroke:5px ${C.paper};font-family:'Playfair Display',Georgia,serif;font-style:italic`);
  const ghosts = [C.gold, C.paper, C.ink].map(col => sprite(b, 600, 'run', { color: col }));
  const run = sprite(b, 600, 'run');
  return { a, q, card, b, lines, word, ghosts, run };
}, (t, c) => {
  const cut = t >= 0.42;
  c.a.style.display = cut ? 'none' : 'block';
  c.b.style.display = cut ? 'block' : 'none';
  if (!cut) {
    const p = eBack(prog(t, 0.02, 0.22));
    place(c.card, 960, 560 + (1 - p) * 140, 0.7 + 0.3 * p, -2 * (1 - p), clamp(t / 0.06));
    place(c.q, 1000 + t * 80, 520, 1 + t * 0.2, -8 + t * 14, 0.9);
    return;
  }
  const fn = tt => {
    const p = eOut(prog(tt, 0.42, 0.5)), st = Math.abs(Math.sin((tt - 0.42) * Math.PI / 0.12));
    return [lerp(-280, 1180, p), 1010 - st * 30, 1, 6, 1, 1 + 0.05 * st, false, 'run'];
  };
  trail(c.ghosts, t, fn, 0.045, 0.6);
  const [x, y, s, r, sx, sy] = fn(t);
  stage(c.run, x, y, s, r, 1, sx, sy);
  c.lines.forEach((l, i) => { l.style.transform = `translate(${1920 - ((t * 3200 + rnd(i) * 2400) % 4200)}px,${120 + i * 105}px)`; });
  place(c.word, 900 - (t - 0.42) * 500, 300, 1, -4, 0.8);
});

/* 01 当然 / 可以 / 好 / 问题：一个词一整屏 */
scene('answer', 0.94, 2.9, el => {
  const conf = [
    [0.94, '当然', 'Of course.', C.paper, C.ink, 'point', 1, C.rose, 560],
    [1.48, '可以', 'You can.', C.rose, C.paper, 'peace', -1, C.ink, 560],
    [2.10, '好', 'Good', C.ink, C.gold, 'jump', 0, C.rose, 1000],
    [2.28, '问题。', 'question.', C.gold, C.ink, 'cheer', 1, C.paper, 470],
  ];
  const ps = conf.map(([at, word, en, bg, fg, pose, side, shadow, size]) => {
    const s = h(el, 'scene', `background:${bg}`);
    const w = big(s, word, size, fg);
    const e = h(s, 'c latin', `font-size:76px;font-style:italic;color:${fg};white-space:nowrap`, en);
    const sh = sprite(s, 780, pose, { color: shadow });
    const a = sprite(s, 780, pose);
    return { s, w, e, sh, a, at, side, pose };
  });
  const sp = stars(ps[3].s, 10, 90, C.paper);
  const band = marquee(ps[3].s, '好问题 · GOOD QUESTION ·', `font-size:58px;background:${C.ink};color:${C.gold};padding:16px 0`);
  return { ps, sp, band };
}, (t, c) => {
  const cur = pick(c.ps, t), o = c.ps[cur];
  const ax = o.side === 0 ? 960 : o.side > 0 ? 1460 : 460, wx = o.side === 0 ? 960 : o.side > 0 ? 700 : 1260;
  const drift = (t - o.at) * 50 * (o.side || 1);
  place(o.w, wx - drift, 480, lerp(1.3, 1, eOut(prog(t, o.at, 0.12))), (o.side || 1) * -2, 1);
  place(o.e, wx - drift, 900, 1, 0, clamp((t - o.at) / 0.08));
  const enter = eOut(prog(t, o.at, 0.14));
  let x = ax + (o.side || 1) * (1 - enter) * 280, y = 1030, sx = 1, sy = 1;
  if (o.pose === 'jump') { y = 860 - Math.sin(prog(t, o.at, 0.18) * Math.PI) * 70; x = 960; }
  else [sx, sy] = squash(t, o.at + 0.07, 0.2);
  if (cur === 3 && t >= 2.5) { const g = groove(t, ['idol', 'cheer', 'peace', 'cheer'], { bob: 24 }); o.a.set(g.pose); o.sh.set(g.pose); y += g.y; sx *= g.sx; sy *= g.sy; }
  stage(o.sh, x + 28, y + 16, 1, 0, 1, sx, sy, o.side < 0);
  stage(o.a, x, y, 1, 0, 1, sx, sy, o.side < 0);
  if (cur === 3) {
    drawBurst(c.sp, t, 2.28, x, 560, 460, 360, 0.55);
    drawMarquee(c.band, t, 700, 1000, -3);
  }
});

scene('grid', 3.94, 6.6, el => {
  const A = h(el, 'scene', `background:${C.paper}`);
  const L = h(A, 'c', `width:960px;height:1080px;background:${C.rose};overflow:hidden`);
  const R = h(A, 'c', `width:960px;height:1080px;background:${C.paper};overflow:hidden`);
  const shA = sprite(L, 800, 'heart', { color: C.ink }), aA = sprite(L, 800, 'heart');
  const vt = h(R, 'c song big', `font-size:340px;color:${C.ink};writing-mode:vertical-rl`, '当然');
  const en = h(R, 'c latin', `font-size:60px;font-style:italic;color:${C.rose};white-space:nowrap`, 'of course.');
  const B = h(el, 'scene', `background:${C.ink}`);
  const cols = [[C.ink, 'wave'], [C.gold, 'point'], [C.night, 'peace']].map(([bg, pose]) => { const d = h(B, 'c', `width:640px;height:1080px;background:${bg};overflow:hidden`); return { d, s: sprite(d, 660, pose) }; });
  const bandB = marquee(B, '当然可以 ·', `font-size:130px;background:${C.rose};color:${C.paper};padding:8px 0`);
  const Cc = h(el, 'scene', `background:${C.ink}`);
  const tiles = Array.from({ length: 8 }, (_, i) => { const d = h(Cc, 'c', `width:470px;height:530px;background:${(i + Math.floor(i / 4)) % 2 ? C.paper : C.rose};overflow:hidden;border-radius:8px`); return { d, s: sprite(d, 430, 'stand') }; });
  const stamp = big(Cc, '好问题。', 340, C.paper, 'text-shadow:0 20px 0 rgba(26,23,20,.4)');
  return { A, L, R, aA, shA, vt, en, B, cols, bandB, Cc, tiles, stamp };
}, (t, c) => {
  const ph = t < 4.70 ? 0 : t < 5.46 ? 1 : 2;
  c.A.style.display = ph === 0 ? 'block' : 'none';
  c.B.style.display = ph === 1 ? 'block' : 'none';
  c.Cc.style.display = ph === 2 ? 'block' : 'none';
  if (ph === 0) {
    const p = eOut(prog(t, 3.94, 0.16));
    c.L.style.transform = `translate(0px,${(1 - p) * -1080}px)`;
    c.R.style.transform = `translate(960px,${(1 - p) * 1080}px)`;
    const g = groove(t, ['heart', 'wave', 'heart', 'peace'], { bob: 20, flip: true });
    act(c.shA, 500, 1060 + 14, g); act(c.aA, 480, 1060, g);
    place(c.vt, 480, 470 - (t - 3.94) * 40, 1, 0, 1);
    place(c.en, 480, 980, 1, 0, clamp((t - 4.06) / 0.1));
  } else if (ph === 1) {
    const seq = ['wave', 'point', 'peace', 'cheer'];
    c.cols.forEach((o, i) => {
      const p = eOut(prog(t, 4.70 + i * 0.05, 0.14));
      o.d.style.transform = `translate(${i * 640}px,${(i % 2 ? 1 : -1) * (1 - p) * 1080}px)`;
      act(o.s, 320, 1050, groove(t, seq.slice(i).concat(seq.slice(0, i)), { bob: 24, flip: i === 1 }));
    });
    drawMarquee(c.bandB, t, 1500, 440, -4);
  } else {
    const fall = prog(t, 5.95, 0.6), SEQ = ['cheer', 'idol', 'peace', 'heart', 'point', 'wave', 'jump', 'catch'];
    const n = Math.floor((t - 5.46) / 0.1);
    c.tiles.forEach((o, i) => {
      const col = i % 4, row = Math.floor(i / 4), at = 5.46 + Math.hypot(col - 1.5, row - 0.5) * 0.03, p = eBack(prog(t, at, 0.16));
      place(o.d, 250 + col * 473, 275 + row * 530 + fall * fall * 1500 * (0.6 + rnd(i) * 0.6), p, fall * (i % 2 ? 1 : -1) * (20 + i * 4), t >= at ? 1 : 0);
      o.s.set(SEQ[(n + i) % 8]);
      const [sx, sy] = squash(t, 5.46 + n * 0.1, 0.12, 0.1);
      stage(o.s, 235, 520, 1, 0, 1, sx, sy, (n + i) % 2 === 1);
    });
    const sp = prog(t, 5.92, 0.12);
    place(c.stamp, 960, 540, lerp(2.3, 1, eOut(sp)) * (1 + eIn(prog(t, 6.32, 0.28)) * 0.5), -4, t >= 5.92 ? 1 : 0);
  }
});

function fit() {
  const k = frame.clientWidth / 1920, kh = frame.clientHeight / 1080, s = Math.min(k, kh);
  canvas.style.transform = `translate(${(frame.clientWidth - 1920 * s) / 2}px,${(frame.clientHeight - 1080 * s) / 2}px) scale(${s})`;
}
new ResizeObserver(fit).observe(frame);
fit();

function preload() {
  const list = [...Object.keys(META[outfit]).map(p => `sprites/${outfit}/alice_${p}.svg`), IMG.icon, ...FRIENDS.map(f => IMG.friend(f[0])), ...UI.map(u => IMG.ui(u[0]))];
  let done = 0, failed = 0;
  return Promise.race([
    Promise.all(list.map(src => new Promise(res => {
      const i = new Image();
      i.onload = () => { done++; $('play').textContent = `加载 ${Math.round(done / list.length * 100)}%`; res(); };
      i.onerror = () => { failed++; res(); };
      i.src = src;
    }))),
    new Promise(res => setTimeout(res, 12000)),
  ]).then(() => failed);
}

$('play').onclick = async () => {
  if (!audio.paused) { audio.pause(); return; }
  try { if (audio.ended || audio.currentTime >= DURATION - 0.05) audio.currentTime = 0; await audio.play(); }
  catch (e) { $('status').textContent = '无法播放音频：' + (e && e.message ? e.message : '浏览器拒绝了播放请求'); $('load').hidden = false; }
};
audio.addEventListener('play', () => { cancelAnimationFrame(raf); $('play').textContent = '暂停'; tick(); });
audio.addEventListener('pause', () => { cancelAnimationFrame(raf); $('play').textContent = '播放'; render(); });
audio.addEventListener('ended', () => { $('play').textContent = '重播'; render(DURATION); });
audio.addEventListener('loadedmetadata', () => { if (Number.isFinite(audio.duration)) $('seek').max = audio.duration; render(); });
audio.addEventListener('seeked', () => render());
audio.addEventListener('error', () => { $('status').textContent = '没有找到 assets/song.mp3，可以点「导入音频」手动选择歌曲。'; $('load').hidden = false; });
$('seek').oninput = () => { audio.currentTime = Number($('seek').value); render(Number($('seek').value)); };
$('cc').onclick = () => { captionsOn = !captionsOn; $('cc').setAttribute('aria-pressed', String(captionsOn)); render(); };
$('fs').onclick = async () => {
  try { if (document.fullscreenElement) await document.exitFullscreen(); else await frame.requestFullscreen(); }
  catch (e) { $('status').textContent = '当前浏览器不支持页面全屏，请使用浏览器自带的全屏。'; }
};
/* 换装：按 OUTFIT_NAMES 顺序轮换，地址栏同步 ?outfit=，刷新后保持；没有对应动作的衣服用 FALLBACK 代替 */
$('outfit').onclick = () => {
  const keys = Object.keys(OUTFIT_NAMES).filter(k => META[k]);
  outfit = keys[(keys.indexOf(outfit) + 1) % keys.length];
  params.set('outfit', outfit);
  history.replaceState(null, '', '?' + params.toString());
  $('outfit').textContent = '换装：' + OUTFIT_NAMES[outfit];
  ACTORS.forEach(b => b.set(b.want));
  render();
};
$('load').onclick = () => $('file').click();
let blobUrl = null;
$('file').onchange = () => {
  const f = $('file').files[0];
  if (!f) return;
  audio.pause();
  if (blobUrl) URL.revokeObjectURL(blobUrl);
  blobUrl = URL.createObjectURL(f);
  audio.src = blobUrl; audio.load();
  $('status').textContent = '已导入：' + f.name;
};
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
  if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { e.preventDefault(); audio.currentTime = clamp(audio.currentTime + (e.code === 'ArrowRight' ? 1 : -1), 0, DURATION); render(); }
});
$('outfit').textContent = '换装：' + OUTFIT_NAMES[outfit];
$('cc').setAttribute('aria-pressed', String(captionsOn));
if (params.get('embed') === '1') document.body.classList.add('embed');

if (!window.SPRITE_META) $('status').textContent = '没有找到 sprites/sprites.js，像素 Alice 无法显示。';
preload().then(failed => {
  $('play').disabled = false;
  $('play').textContent = '播放';
  if (failed) $('status').textContent = `有 ${failed} 张图片没有加载成功，画面会缺图，请检查 assets 与 sprites 目录。`;
  const freeze = params.get('t');
  const go = () => { render(freeze === null ? 0 : Number(freeze)); document.body.dataset.ready = '1'; };
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(go));
});
render(0);
</script>
</body>
</html>
