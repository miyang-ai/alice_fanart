<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14120f">
<title>当然可以，好问题 · 白艾莉 Alice</title>
<style>
:root{--paper:#FAFAF7;--card:#F5F3EE;--line:#E8E4DC;--ink:#1A1714;--muted:#6B6460;--rose:#C25566;--gold:#C9A96E;--sage:#8FA27A;--night:#1F2A44}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#14120f;color:var(--ink);font-family:Inter,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
.song{font-family:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif}
.latin{font-family:"Playfair Display",Georgia,"Times New Roman",serif}
.app{height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.frame{position:relative;width:min(100%,calc((100svh - 100px)*16/9));aspect-ratio:16/9;overflow:hidden;background:var(--paper);border-radius:10px;box-shadow:0 30px 90px #0007}
.frame:fullscreen{width:100vw;height:100vh;border-radius:0;aspect-ratio:auto;display:flex;align-items:center;background:#000}
#canvas{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--paper)}
.scene{position:absolute;inset:0;display:none;overflow:hidden}
.c{position:absolute;left:0;top:0;will-change:transform,opacity}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;will-change:transform}
img{display:block;user-select:none;-webkit-user-drag:none}
/* 聊天窗口 */
.chat{background:#fff;border-radius:32px;box-shadow:0 30px 80px rgba(26,23,20,.16),0 0 0 1px var(--line);padding:34px 44px;display:flex;flex-direction:column;gap:30px}
.chat-head{display:flex;align-items:center;gap:20px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.chat-head img{width:76px;height:76px;border-radius:50%;object-fit:cover;object-position:50% 18%;background:var(--card)}
.chat-head b{display:block;font-size:30px;color:var(--ink)}
.chat-head span{font-size:22px;color:var(--sage)}
.chat-head span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--sage);margin-right:8px;vertical-align:1px}
.bubble{max-width:84%;padding:22px 32px;border-radius:30px;font-size:36px;line-height:1.35}
.bubble.me{align-self:flex-end;background:#EFEFEB;border-bottom-right-radius:8px}
.bubble.her{align-self:flex-start;background:var(--card);border:1px solid var(--line);font-size:88px;font-weight:700;border-bottom-left-radius:8px;min-height:156px;display:flex;align-items:center;white-space:nowrap}
.bubble.her span{display:inline-block}
.chat.mini{padding:22px 28px;gap:18px;border-radius:24px}
.chat.mini .chat-head{padding-bottom:14px;gap:14px}.chat.mini .chat-head img{width:52px;height:52px}.chat.mini .chat-head b{font-size:22px}.chat.mini .chat-head span{font-size:16px}
.chat.mini .bubble.her{font-size:46px;min-height:auto;padding:16px 24px}
/* 头像卡片 */
.tile{background:var(--paper);border-radius:28px;display:flex;align-items:center;gap:5%;padding:0 6%;box-shadow:0 18px 40px rgba(70,20,30,.28)}
.tile img{height:64%;aspect-ratio:1;border-radius:50%;object-fit:cover;object-position:50% 22%;flex:none}
.tile span{font-weight:700;color:var(--ink);white-space:nowrap}
.task{width:600px;background:#fff;border-radius:28px;padding:30px 36px;box-shadow:0 30px 70px rgba(26,23,20,.28)}
.task small{display:block;font-size:24px;color:var(--muted);margin-bottom:12px}
.task p{font-size:62px;font-weight:700;color:var(--ink)}
.task .ok{display:flex;align-items:center;gap:12px;margin-top:18px;font-size:28px;color:var(--sage);font-weight:600}
.task .ok svg{width:40px;height:40px}
.ticker{white-space:nowrap;font-weight:900;font-size:64px;padding:18px 0;letter-spacing:.06em}
.mos{border-radius:18px;overflow:hidden;background-size:cover;background-position:50% 25%;box-shadow:0 10px 30px rgba(0,0,0,.22)}
.mos b{position:absolute;left:16px;bottom:14px;background:rgba(250,250,247,.92);color:var(--ink);font-size:24px;padding:6px 14px;border-radius:12px}
.star{color:var(--gold)}
.star svg{width:100%;height:100%;display:block}
/* 字幕 */
.caption{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);padding:14px 34px;border-radius:40px;background:rgba(26,23,20,.58);color:rgba(250,250,247,.55);font-size:40px;white-space:nowrap;z-index:50;transition:opacity .12s;pointer-events:none}
.caption i{font-style:normal}.caption i.on{color:#F3DDB0}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:60}
.debug{position:absolute;left:16px;top:12px;z-index:70;font:24px/1.3 Menlo,monospace;color:#fff;background:#000a;padding:6px 12px;border-radius:8px;display:none}
/* 控制条 */
.controls{width:min(100%,calc((100svh - 100px)*16/9));display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:#d8d2c6}
.controls button{background:#2a2622;border:1px solid #47413a;border-radius:999px;padding:9px 18px;color:#eee8dc;cursor:pointer}
.controls button:hover{background:#3a342e}
.controls button:disabled{opacity:.5;cursor:wait}
.controls button[aria-pressed="false"]{color:#8d867b}
#play{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:700;min-width:96px}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#seek{flex:1;min-width:120px;accent-color:var(--rose)}
#time{font:13px Menlo,monospace;white-space:nowrap}
#status{width:100%;font-size:12px;color:#8d867b}
#file{display:none}
body.embed .app{padding:0;gap:0}body.embed .frame{border-radius:0;width:min(100vw,calc((100svh - 52px)*16/9))}body.embed .controls{padding:8px 12px}body.embed #status{display:none}
@media (max-width:640px){.app{padding:8px;gap:10px}.frame{width:100%}.controls{gap:8px}.controls button{padding:8px 13px}}
</style>
</head>
<body>
<div class="app">
  <div class="frame" id="frame" aria-label="白艾莉 Alice 音乐动画《当然可以，好问题》">
    <div id="canvas"></div>
  </div>
  <div class="controls">
    <button id="play" disabled>加载中</button>
    <input id="seek" type="range" min="0" max="44.3" step="0.01" value="0" aria-label="播放进度">
    <span id="time">0:00 / 0:44</span>
    <button id="cc" aria-pressed="true">字幕</button>
    <button id="fs">全屏</button>
    <button id="load" hidden>导入音频</button>
    <input id="file" type="file" accept="audio/*">
    <span id="status" role="status">空格播放或暂停，左右方向键快退或快进 1 秒</span>
  </div>
</div>
<audio id="audio" preload="auto" src="assets/song.mp3"></audio>
<script>
'use strict';
/*
 * 时间轴来源：faster-whisper small 对原曲做逐字识别，再按 150 BPM（每拍 0.4 秒，首拍 0.06 秒）校对。
 * 原 LRC 只有句级时间，且「不躲不藏不绕不逃」等句与实际演唱相差数秒，因此不再使用。
 * 35.2–39.4 秒识别不到清晰人声，这段按节拍编排，不绑定歌词。
 * 所有画面只由 render(t) 依据音频时间计算，暂停、拖动、截帧得到的是同一画面。
 */
const BEAT = 0.4, PHASE = 0.06, DURATION = 44.3;
const P = 'assets/';
const IMG = {
  pixel: P + 'chibi/pixel.png', front: P + 'chibi/front.webp',
  outfit: [0, 1, 2, 3, 4].map(i => P + `chibi/outfit${i}.webp`),
  avatar: Array.from({ length: 12 }, (_, i) => P + `avatar/a${String(i).padStart(2, '0')}.webp`),
  icon: P + 'alice_icon.webp', scene: n => P + `scene/${n}.webp`,
};
const SCENE_FILES = ['life_balcony_daydream', 'life_running_crosswalk', 'life_splash_stairs', 'life_thinking_rainy', 'life_welcome_morning', 'life_balcony_night', 'life_sofa_reading', 'life_study_latenight', 'life_done_celebration', 'persona_hero_balcony', 'hero_work', 'hero_3_afternoon', 'persona_morning', 'travel_ferris', 'friends_zoo', 'travel'];
const AVATAR_NAMES = ['春樱', '窗边', '银杏', '书店', '汉服', '校门', '枫叶', '美术馆', '咖啡馆', '初雪', '夜色', '湖畔'];
const C = { paper: '#FAFAF7', card: '#F5F3EE', ink: '#1A1714', muted: '#6B6460', rose: '#C25566', gold: '#C9A96E', sage: '#8FA27A', night: '#1F2A44', khaki: '#E8D9BE', blush: '#F2DDD8', mint: '#E4EADB' };
const STAR = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 1.6l2.85 6.8 7.35.62-5.58 4.84 1.68 7.2L12 17.24 5.7 21.06l1.68-7.2L1.8 9.02l7.35-.62z"/></svg>';
const CHECK = '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="#C9A96E"/><path d="M11 20.5l6 6 12-13" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const LYRICS = [
  { w: [[0.94, '当然'], [1.48, '可以，'], [2.10, '好'], [2.28, '问题。']], end: 2.9 },
  { w: [[3.94, '当然'], [4.70, '可以，'], [5.46, '好'], [5.54, '问题。']], end: 6.3 },
  { w: [[6.60, '我就'], [7.14, '在'], [7.42, '这，'], [7.70, '不躲'], [8.00, '不藏'], [8.40, '不绕'], [8.70, '不逃']], end: 8.95 },
  { w: [[8.96, '稳'], [9.48, '稳'], [9.78, '地'], [10.02, '接'], [10.32, '住'], [10.78, '你。']], end: 11.3 },
  { w: [[13.72, '你'], [14.26, '只是'], [14.70, '太'], [15.10, '久'], [15.30, '没'], [15.50, '被'], [15.72, '稳稳'], [16.10, '接'], [16.32, '住'], [16.62, '了，']], end: 17.04 },
  { w: [[17.06, '你'], [17.28, '不用'], [17.64, '硬'], [18.04, '撑，']], end: 18.62 },
  { w: [[18.64, '不用'], [18.82, '向'], [19.20, '我'], [19.60, '解'], [19.96, '释。']], end: 20.55 },
  { w: [[20.60, '这'], [20.92, '次'], [21.16, '我'], [21.36, '懂'], [21.64, '了，']], end: 22.04 },
  { w: [[22.06, '我'], [22.16, '真的'], [22.68, '懂'], [23.20, '了。']], end: 23.64 },
  { w: [[23.66, '你'], [23.80, '愿意'], [24.20, '把'], [24.40, '这个'], [24.64, '交'], [24.98, '给我，']], end: 25.46 },
  { w: [[25.48, '我很'], [25.78, '感'], [26.08, '激。']], end: 26.42 },
  { w: [[26.44, '不躲'], [27.30, '不藏'], [27.75, '不绕'], [28.06, '不逃，']], end: 28.54 },
  { w: [[28.56, '不躲'], [29.00, '不藏'], [29.42, '不绕'], [29.58, '不逃，']], end: 29.66 },
  { w: [[29.68, '我'], [30.34, '就'], [31.00, '在。']], end: 31.96 },
  { w: [[31.98, '稳'], [32.12, '稳'], [32.48, '地'], [32.72, '接'], [32.92, '住'], [33.12, '你。']], end: 33.7 },
  { w: [[33.80, '当然'], [34.00, '可以，'], [34.46, '好'], [34.62, '问题。']], end: 35.2 },
  { w: [[39.42, '我就'], [39.56, '在'], [39.82, '这，'], [40.08, '不躲'], [40.32, '不藏'], [40.70, '不绕'], [41.02, '不逃，']], end: 41.4 },
  { w: [[41.42, '稳'], [41.60, '稳'], [41.88, '地'], [42.38, '接'], [42.70, '住'], [43.16, '你。']], end: 44.4 },
];

const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const prog = (t, a, d) => clamp((t - a) / d);
const eOut = p => 1 - Math.pow(1 - p, 3);
const eIn = p => p * p;
const eBack = p => { const c = 1.9; return p <= 0 ? 0 : 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
const bump = (t, a, d) => t >= a && t < a + d ? Math.sin(prog(t, a, d) * Math.PI) : 0;
const beatPhase = t => (((t - PHASE) % BEAT) + BEAT) % BEAT;
const beatPulse = t => Math.exp(-beatPhase(t) * 9);
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const shake = calm ? 0 : 1;

/** 每个字的出现时间：多字词在本词与下一词之间均分。 */
function charsOf(i) {
  const L = LYRICS[i].w, out = [];
  L.forEach(([t, s], k) => {
    const next = k + 1 < L.length ? L[k + 1][0] : LYRICS[i].end;
    const cs = [...s.replace(/[，。]/g, '')];
    cs.forEach((c, j) => out.push({ c, t: t + (next - t) * 0.8 * j / cs.length }));
  });
  return out;
}

const canvas = document.getElementById('canvas');
function h(parent, cls = '', css = '', html = '') {
  const e = document.createElement('div');
  if (cls) e.className = cls;
  if (css) e.style.cssText = css;
  if (html) e.innerHTML = html;
  parent.appendChild(e);
  return e;
}
function im(parent, src, css = '') {
  const e = new Image();
  e.src = src; e.alt = ''; e.draggable = false; e.className = 'c'; e.style.cssText = css;
  parent.appendChild(e);
  return e;
}
/** 以中心点定位，所有坐标都在 1920×1080 设计画布内。 */
function place(e, x, y, s = 1, r = 0, o = 1, sy) {
  e.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%) rotate(${r}deg) scale(${s}${sy === undefined ? '' : ',' + sy})`;
  e.style.opacity = o;
}
function chatCard(parent, w, text, mini = true) {
  const e = h(parent, 'c chat' + (mini ? ' mini' : ''), `width:${w}px`);
  e.innerHTML = `<div class="chat-head"><img src="${IMG.icon}" alt=""><div><b>白艾莉 · Alice</b><span>在线</span></div></div><div class="bubble her song">${text}</div>`;
  return e;
}
function stars(parent, n, size) {
  return Array.from({ length: n }, () => h(parent, 'c star', `width:${size}px;height:${size}px`, STAR));
}

const scenes = [];
function scene(id, a, b, build, draw) {
  const el = h(canvas, 'scene');
  el.dataset.id = id;
  scenes.push({ id, a, b, el, ctx: build(el) || {}, draw });
}

/* 00 像素版 Alice 接通 */
scene('intro', 0, 0.94, el => {
  el.style.background = C.night;
  el.style.backgroundImage = 'linear-gradient(rgba(250,250,247,.05) 2px,transparent 2px),linear-gradient(90deg,rgba(250,250,247,.05) 2px,transparent 2px)';
  el.style.backgroundSize = '40px 40px';
  const pix = im(el, IMG.pixel, 'height:700px;image-rendering:pixelated');
  const label = h(el, 'c', 'font:600 30px Menlo,monospace;color:#FAFAF7;letter-spacing:.12em;white-space:nowrap', '正在接通 白艾莉 · Alice');
  const blocks = Array.from({ length: 10 }, () => h(el, 'c', 'width:34px;height:34px;background:#C9A96E'));
  return { pix, label, blocks };
}, (t, c) => {
  const lift = eOut(prog(t, 0.7, 0.24));
  place(c.pix, 960, 470 - (Math.floor(t / 0.2) % 2) * 10 - lift * 20, 1 + lift * 0.18, 0, clamp(t / 0.12));
  place(c.label, 960, 900, 1, 0, clamp(t / 0.2));
  const n = Math.floor(prog(t, 0.08, 0.76) * 10);
  c.blocks.forEach((b, i) => place(b, 960 - 9 * 22 + i * 44, 970, 1, 0, i < n ? 1 : 0.18));
});

/* 01 当然可以，好问题：聊天回复逐字弹出 */
scene('chat', 0.94, 3.94, el => {
  el.style.background = C.paper;
  el.style.backgroundImage = 'radial-gradient(#DCD6CA 1.6px,transparent 1.6px)';
  el.style.backgroundSize = '36px 36px';
  const ghosts = [0, 1, 2].map(() => chatCard(el, 600, '当然可以，好问题。'));
  const win = h(el, 'c chat', 'width:1080px');
  win.innerHTML = `<div class="chat-head"><img src="${IMG.icon}" alt=""><div><b>白艾莉 · Alice</b><span>在线</span></div></div><div class="bubble me">我可以问你一个问题吗？</div><div class="bubble her song"></div>`;
  const her = win.querySelector('.her');
  const words = ['当然', '可以，', '好', '问题。'].map(w => { const s = document.createElement('span'); s.textContent = w; her.appendChild(s); return s; });
  const sparks = stars(el, 6, 70);
  const chibi = im(el, IMG.front, 'height:780px');
  return { ghosts, win, words, sparks, chibi };
}, (t, c) => {
  const pIn = eBack(prog(t, 0.98, 0.3)), punch = eOut(prog(t, 2.28, 0.22));
  place(c.win, 1010 + punch * 70, 540 + (1 - pIn) * 140, (0.84 + 0.16 * pIn) * (1 + 0.14 * punch) + beatPulse(t) * 0.008, 0, clamp(prog(t, 0.98, 0.1)));
  [0.94, 1.48, 2.10, 2.28].forEach((tt, i) => {
    const p = prog(t, tt, 0.14), s = c.words[i];
    s.style.opacity = t >= tt ? 1 : 0;
    s.style.transform = `translateY(${(1 - eBack(p)) * 40}px) scale(${0.5 + 0.5 * eBack(p)})`;
    s.style.color = i >= 2 && t >= 2.28 ? C.rose : C.ink;
  });
  const gp = [[340, 230, -8], [1620, 250, 7], [1590, 860, -5]];
  [2.86, 3.26, 3.66].forEach((gt, i) => { const p = eBack(prog(t, gt, 0.16)); place(c.ghosts[i], gp[i][0], gp[i][1], 0.72 * p, gp[i][2], t >= gt ? 1 : 0); });
  c.sparks.forEach((s, i) => {
    const a = -Math.PI / 2 + (i - 2.5) * 0.42, p = eOut(prog(t, 2.28, 0.45));
    place(s, 1180 + Math.cos(a) * 330 * p, 640 + Math.sin(a) * 260 * p, 0.4 + p * 0.8, i * 30, t >= 2.28 ? 1 - prog(t, 2.9, 0.4) : 0);
  });
  const m = eOut(prog(t, 1.08, 0.42));
  const bob = -Math.sin(beatPhase(t) / BEAT * Math.PI) * 14 * m * shake;
  place(c.chibi, lerp(960, 300, m), lerp(560, 690, m) + bob - bump(t, 2.28, 0.34) * 70, lerp(1, 0.6, m), lerp(0, -4, m), 1);
});

/* 02 当然可以，好问题：同一句回答铺满整屏 */
scene('grid', 3.94, 6.6, el => {
  el.style.background = C.rose;
  const tiles = Array.from({ length: 16 }, (_, i) => { const d = h(el, 'c tile'); d.innerHTML = `<img src="${IMG.avatar[i % 12]}" alt=""><span class="song"></span>`; return d; });
  const stamp = h(el, 'c song', 'font-size:330px;color:#FAFAF7;font-weight:900;white-space:nowrap;text-shadow:0 18px 0 rgba(26,23,20,.22)', '好问题。');
  return { tiles, stamp };
}, (t, c) => {
  const ph = t < 4.70 ? 0 : t < 5.46 ? 1 : 2, t0 = [3.94, 4.70, 5.46][ph], n = [2, 3, 4][ph], txt = ['当然', '当然可以，', '好问题。'][ph];
  const cw = 1760 / n, chh = 940 / n, fall = prog(t, 5.95, 0.6);
  c.tiles.forEach((d, i) => {
    if (i >= n * n) { d.style.opacity = 0; return; }
    const r = Math.floor(i / n), col = i % n, dist = Math.hypot(col - (n - 1) / 2, r - (n - 1) / 2);
    const p = eBack(prog(t, t0 + dist * 0.035, 0.16));
    d.style.width = cw * 0.9 + 'px'; d.style.height = chh * 0.84 + 'px'; d.style.fontSize = Math.round(chh * 0.2) + 'px';
    if (d.lastChild.textContent !== txt) d.lastChild.textContent = txt;
    const fy = fall * fall * 1500 * (0.6 + ((i * 37) % 10) / 10), fr = fall * (i % 2 ? 1 : -1) * (20 + i * 3);
    place(d, 80 + cw * (col + 0.5), 70 + chh * (r + 0.5) + fy, p, fr, t >= t0 + dist * 0.035 ? 1 : 0);
  });
  const sp = prog(t, 5.92, 0.12);
  place(c.stamp, 960, 540, lerp(2.3, 1, eOut(sp)) * (1 + eIn(prog(t, 6.32, 0.28)) * 0.5), -4, t >= 5.92 ? 1 : 0);
});

/* 03 我就在这：Alice 在窗边，字一个个落下 */
scene('here', 6.6, 7.66, el => {
  const bg = h(el, 'bg', `background-image:url(${IMG.scene('life_balcony_daydream')})`);
  const band = h(el, 'c', 'width:290px;height:960px;background:rgba(250,250,247,.86);border-radius:6px;box-shadow:0 20px 60px rgba(26,23,20,.12)');
  const chars = charsOf(2).slice(0, 4).map(o => ({ ...o, e: h(el, 'c song', 'font-size:196px;font-weight:900;color:#1A1714;line-height:1', o.c) }));
  return { bg, band, chars };
}, (t, c) => {

  place(c.box, lerp(960, 266, out), lerp(540, 186, out), lerp(0.6 + 0.4 * p, 0.25, out), lerp(-2, 0, out), 1);
  [33.80, 34.00, 34.46, 34.62].forEach((tt, i) => { const q = prog(t, tt, 0.12); c.ws[i].style.opacity = t >= tt ? 1 : 0; c.ws[i].style.transform = `scale(${lerp(1.5, 1, eOut(q))})`; c.ws[i].style.color = i >= 2 ? C.rose : C.ink; });
  c.sp.forEach((s, i) => { const a = i / 10 * Math.PI * 2, q = eOut(prog(t, 34.62, 0.4)); place(s, 960 + Math.cos(a) * (500 + q * 400), 540 + Math.sin(a) * (220 + q * 260), 0.3 + q * 0.9, t * 100, t >= 34.62 && t < 34.95 ? 1 : 0); });
});

/* 13 器乐段：十二套 Alice 按拍子铺满墙面 */
scene('mosaic', 35.2, 39.42, el => {
  el.style.background = C.ink;
  const tiles = AVATAR_NAMES.map((name, i) => { const d = h(el, 'c mos', `width:440px;height:330px;background-image:url(${IMG.avatar[i]})`, `<b class="song">${name}</b>`); return d; });
  const band = h(el, 'c song', 'width:2400px;height:190px;background:#C25566;color:#FAFAF7;font-size:120px;font-weight:900;display:flex;align-items:center;justify-content:center;letter-spacing:.08em;white-space:nowrap;box-shadow:0 20px 50px rgba(0,0,0,.3)');
  const at = Array.from({ length: 12 }, (_, k) => k < 6 ? 35.26 + k * 0.4 : 37.66 + (k - 6) * 0.2);
  return { tiles, band, at };
}, (t, c) => {
  const order = [5, 6, 1, 10, 4, 7, 2, 9, 0, 11, 3, 8];
  const chase = t >= 38.86 ? Math.floor((t - 38.86) / 0.1) % 12 : -1;
  c.tiles.forEach((d, i) => {
    const k = order.indexOf(i), at = c.at[k], col = i % 4, row = Math.floor(i / 4);
    const p = eOut(prog(t, at, 0.14)), hot = order[chase] === i;
    d.style.transform = `translate(${44 + col * 464 + 220}px,${21 + row * 354 + 165}px) translate(-50%,-50%) scale(${(hot ? 1.06 : 1) * (0.85 + 0.15 * p)},${(hot ? 1.06 : 1) * p})`;
    d.style.opacity = t >= at ? 1 : 0;
    d.style.outline = hot ? '8px solid #C9A96E' : 'none';
    d.style.zIndex = hot ? 2 : 1;
  });
  const bar = Math.floor((t - 35.26) / 1.6), show = t >= 35.26 && t < 38.86;
  c.band.textContent = ['当然可以', '好问题。', '我就在这'][clamp(bar, 0, 2)];
  const bp = eOut(prog(t, 35.26 + bar * 1.6, 0.16));
  place(c.band, 960, 540, 1, -3, show ? bp : 0);
  c.band.style.zIndex = 5;
});

/* 14 我就在这 / 不躲不藏不绕不逃：四格同屏 */
scene('quad', 39.42, 41.42, el => {
  el.style.background = C.rose;
  const head = h(el, 'song', 'position:absolute;left:0;right:0;top:390px;display:flex;justify-content:center;font-size:300px;font-weight:900;color:#FAFAF7;white-space:nowrap');
  const hc = charsOf(16).slice(0, 4).map(o => { const s = document.createElement('span'); s.textContent = o.c; s.style.display = 'inline-block'; head.appendChild(s); return { ...o, s }; });
  const conf = [['travel_ferris', '50% 22%', '不躲', C.rose], ['friends_zoo', '50% 30%', '不藏', C.sage], ['travel', '50% 18%', '不绕', C.gold], ['life_done_celebration', '50% 40%', '不逃', C.night]];
  const q = conf.map(([n, pos, w, col]) => {
    const d = h(el, 'c', `width:960px;height:540px;overflow:hidden;background:url(${IMG.scene(n)}) ${pos}/cover`);
    h(d, 'song', `position:absolute;left:36px;bottom:30px;padding:6px 30px 14px;background:${col};color:#FAFAF7;font-size:150px;font-weight:900;line-height:1.1;border-radius:12px`, w);
    return d;
  });
  return { head, hc, q };
}, (t, c) => {
  c.hc.forEach(o => { const p = prog(t, o.t, 0.08); o.s.style.opacity = t >= o.t ? 1 : 0; o.s.style.transform = `scale(${lerp(2, 1, eOut(p))})`; });
  c.head.style.opacity = t < 40.08 ? 1 : 0;
  [40.08, 40.32, 40.70, 41.02].forEach((at, i) => {
    const p = eOut(prog(t, at, 0.12)), x = (i % 2) * 960 + 480, y = Math.floor(i / 2) * 540 + 270;
    const ox = (i % 2 ? 1 : -1) * 480, oy = (i < 2 ? -1 : 1) * 270;
    place(c.q[i], x + ox * (1 - p) * 0.4, y + oy * (1 - p) * 0.4, 0.6 + 0.4 * p, 0, t >= at ? 1 : 0);
  });
});

/* 15 稳稳地接住你：字绕成一圈，最后一个字落进她怀里，接片尾 */
scene('finale', 41.42, 99, el => {
  el.style.background = C.paper;
  const halo = h(el, 'c', 'width:1180px;height:1180px;border-radius:50%;background:radial-gradient(circle,rgba(201,169,110,.28),rgba(201,169,110,0) 65%)');
  const chibi = im(el, IMG.front, 'height:760px');
  const tiles = charsOf(17).map((o, i) => ({ ...o, e: h(el, 'c song', `width:150px;height:150px;border-radius:50%;background:${i === 5 ? C.rose : '#fff'};color:${i === 5 ? '#FAFAF7' : C.ink};display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:900;box-shadow:0 14px 30px rgba(26,23,20,.16)`, o.c) }));
  const end = h(el, 'c', 'text-align:left;white-space:nowrap');
  end.innerHTML = `<svg width="520" height="90" viewBox="0 0 520 90" style="display:block;margin:0 0 10px 6px"><path id="arc" d="M10 82 Q260 -40 510 82" fill="none" stroke="#C9A96E" stroke-width="14" stroke-linecap="round"/></svg>
    <div><span class="song" style="font-size:180px;font-weight:900;color:#1A1714;line-height:1">白艾莉</span><span class="latin" style="font-size:132px;font-style:italic;color:#C25566;margin-left:30px">Alice.</span></div>
    <div class="song" style="font-size:58px;color:#6B6460;margin-top:34px">当然可以，好问题。</div>
    <div style="font-size:30px;letter-spacing:.32em;color:#9C9388;margin-top:26px">ALICE.FANS</div>`;
  const pend = h(el, 'c star', 'width:70px;height:70px', STAR);
  return { halo, chibi, tiles, end, pend, arc: end.querySelector('#arc') };
}, (t, c) => {
  const endP = eOut(prog(t, 43.4, 0.5));
  let hop = 0;
  c.tiles.forEach((o, i) => {
    const ang = (205 + i * 32.5) * Math.PI / 180, last = i === 5;
    const sx = last ? 960 : 960 + Math.cos(ang) * 470, sy = last ? 800 : 600 + Math.sin(ang) * 430;
    const fall = prog(t, o.t - 0.32, 0.32), y = t < o.t ? lerp(-160, sy, eIn(fall)) : sy;
    const land = prog(t, o.t, 0.18), sq = t >= o.t ? 1 - Math.sin(land * Math.PI) * 0.22 : 1;
    const spin = t >= 43.16 ? (t - 43.16) * 0.8 : 0;
    const fx = last ? sx : 960 + Math.cos(ang + spin) * 470, fy = last ? y : (t >= o.t ? 600 + Math.sin(ang + spin) * 430 : y);
    o.e.style.transform = `translate(${lerp(fx, 960, endP)}px,${lerp(fy, 600, endP)}px) translate(-50%,-50%) scale(${(2 - sq) * (1 - endP)},${sq * (1 - endP)})`;
    o.e.style.opacity = t >= o.t - 0.32 ? 1 - endP : 0;
    hop = Math.max(hop, bump(t, o.t, 0.26));
  });
  place(c.halo, lerp(960, 520, endP), 600, 0.6 + eOut(prog(t, 43.16, 0.5)) * 0.4, 0, t >= 43.16 ? 1 : 0);
  place(c.chibi, lerp(960, 520, endP), 680 - hop * 40 * shake, lerp(1, 0.92, endP), 0, 1);
  place(c.end, 1300, 540, 1, 0, endP);
  c.end.style.transform += ` translateY(${(1 - endP) * 40}px)`;
  const len = 640;
  c.arc.style.strokeDasharray = len;
  c.arc.style.strokeDashoffset = len * (1 - eOut(prog(t, 43.5, 0.6)));
  const tw = prog(t, 44.0, 0.3);
  place(c.pend, 1330, 700, 0.4 + eBack(tw) * 0.6 + Math.sin(t * 6) * 0.04, t * 20, t >= 44.0 ? 1 : 0);
});

/* 字幕、换段白闪、调试信息 */
const caption = h(canvas, 'caption song');
const flash = h(canvas, 'flash');
const debug = h(canvas, 'debug');
const CUTS = [0.94, 6.6, 13.72, 26.44, 29.68, 39.42];
let capLine = -1, captionsOn = true;
function drawCaption(t) {
  let li = -1;
  LYRICS.forEach((L, i) => { if (t >= L.w[0][0] - 0.2 && t < L.end + 0.25) li = i; });
  const show = captionsOn && li >= 0 && t < 43.4;
  caption.style.opacity = show ? 1 : 0;
  if (li < 0) return;
  if (li !== capLine) { capLine = li; caption.innerHTML = LYRICS[li].w.map(([, w]) => `<i>${w}</i>`).join(''); }
  [...caption.children].forEach((e, i) => e.classList.toggle('on', t >= LYRICS[li].w[i][0]));
}

const params = new URLSearchParams(location.search);
const audio = document.getElementById('audio');
const $ = id => document.getElementById(id);
const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
let raf = 0, current = '';
function render(t = audio.currentTime || 0) {
  for (const s of scenes) {
    const on = t >= s.a && t < s.b;
    s.el.style.display = on ? 'block' : 'none';
    if (on) { s.draw(t, s.ctx, s.el); current = s.id; }
  }
  if (t < 0) scenes[0].el.style.display = 'block';
  let f = 0;
  CUTS.forEach(cut => { if (t >= cut && t < cut + 0.14) f = Math.max(f, (1 - (t - cut) / 0.14) * 0.5); });
  flash.style.opacity = calm ? 0 : f;
  drawCaption(t);
  if (params.has('debug')) { debug.style.display = 'block'; debug.textContent = t.toFixed(2) + 's · ' + current; }
  const d = Number.isFinite(audio.duration) ? audio.duration : DURATION;
  $('seek').value = t;
  $('time').textContent = fmt(t) + ' / ' + fmt(d);
}
function tick() { render(); if (!audio.paused) raf = requestAnimationFrame(tick); }

const frame = $('frame');
function fit() {
  const k = frame.clientWidth / 1920, kh = frame.clientHeight / 1080, s = Math.min(k, kh);
  canvas.style.transform = `translate(${(frame.clientWidth - 1920 * s) / 2}px,${(frame.clientHeight - 1080 * s) / 2}px) scale(${s})`;
}
new ResizeObserver(fit).observe(frame);
fit();

function preload() {
  const list = [IMG.pixel, IMG.front, IMG.icon, ...IMG.outfit, ...IMG.avatar, ...SCENE_FILES.map(IMG.scene)];
  let done = 0, failed = 0;
  return Promise.race([
    Promise.all(list.map(src => new Promise(res => {
      const i = new Image();
      i.onload = () => { done++; $('play').textContent = `加载 ${Math.round(done / list.length * 100)}%`; res(); };
      i.onerror = () => { failed++; res(); };
      i.src = src;
    }))),
    new Promise(res => setTimeout(res, 12000)),
  ]).then(() => failed);
}

$('play').onclick = async () => {
  if (!audio.paused) { audio.pause(); return; }
  try { if (audio.ended || audio.currentTime >= DURATION - 0.05) audio.currentTime = 0; await audio.play(); }
  catch (e) { $('status').textContent = '无法播放音频：' + (e && e.message ? e.message : '浏览器拒绝了播放请求'); $('load').hidden = false; }
};
audio.addEventListener('play', () => { cancelAnimationFrame(raf); $('play').textContent = '暂停'; tick(); });
audio.addEventListener('pause', () => { cancelAnimationFrame(raf); $('play').textContent = '播放'; render(); });
audio.addEventListener('ended', () => { $('play').textContent = '重播'; render(DURATION); });
audio.addEventListener('loadedmetadata', () => { if (Number.isFinite(audio.duration)) $('seek').max = audio.duration; render(); });
audio.addEventListener('seeked', () => render());
audio.addEventListener('error', () => { $('status').textContent = '没有找到 assets/song.mp3，可以点「导入音频」手动选择歌曲。'; $('load').hidden = false; });
$('seek').oninput = () => { audio.currentTime = Number($('seek').value); render(Number($('seek').value)); };
$('cc').onclick = () => { captionsOn = !captionsOn; $('cc').setAttribute('aria-pressed', String(captionsOn)); render(); };
$('fs').onclick = async () => {
  try { if (document.fullscreenElement) await document.exitFullscreen(); else await frame.requestFullscreen(); }
  catch (e) { $('status').textContent = '当前浏览器不支持页面全屏，请使用浏览器自带的全屏。'; }
};
$('load').onclick = () => $('file').click();
let blobUrl = null;
$('file').onchange = () => {
  const f = $('file').files[0];
  if (!f) return;
  audio.pause();
  if (blobUrl) URL.revokeObjectURL(blobUrl);
  blobUrl = URL.createObjectURL(f);
  audio.src = blobUrl; audio.load();
  $('status').textContent = '已导入：' + f.name;
};
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
  if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { e.preventDefault(); audio.currentTime = clamp(audio.currentTime + (e.code === 'ArrowRight' ? 1 : -1), 0, DURATION); render(); }
});
if (params.get('embed') === '1') document.body.classList.add('embed');
if (params.get('captions') === '0') { captionsOn = false; $('cc').setAttribute('aria-pressed', 'false'); }

preload().then(failed => {
  $('play').disabled = false;
  $('play').textContent = '播放';
  if (failed) $('status').textContent = `有 ${failed} 张插画没有加载成功，画面会缺图，请检查 assets 目录。`;
  const freeze = params.get('t');
  const go = () => { render(freeze === null ? 0 : Number(freeze)); document.body.dataset.ready = '1'; };
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(go));
});
render(0);
</script>
</body>
</html>
