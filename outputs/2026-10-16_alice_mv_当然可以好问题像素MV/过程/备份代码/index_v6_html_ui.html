<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14120f">
<title>当然可以，好问题 · 白艾莉 Alice</title>
<style>
:root{--paper:#FAFAF7;--bg:#F8F6F3;--text:#43352B;--muted:#65564B;--accent:#997F5B;--accent-ink:#7E6E4D;--warm:#C9A96E;--ink:#1A1714;--rose:#C25566;--gold:#C9A96E;--sage:#8FA27A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#14120f;color:var(--text);font-family:Inter,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
.song{font-family:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif}
.latin{font-family:"Playfair Display",Georgia,"Times New Roman",serif}
.mono{font-family:"PT Mono",Menlo,monospace}
.app{height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.frame{position:relative;width:min(100%,calc((100svh - 100px)*16/9));aspect-ratio:16/9;overflow:hidden;background:var(--paper);border-radius:10px;box-shadow:0 30px 90px #0007}
.frame:fullscreen{width:100vw;height:100vh;border-radius:0;aspect-ratio:auto;display:flex;align-items:center;background:#000}
#canvas{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--paper)}
.scene{position:absolute;inset:0;display:none;overflow:hidden}
.c{position:absolute;left:0;top:0;will-change:transform,opacity}
img{display:block;user-select:none;-webkit-user-drag:none}
svg.i{display:block;flex:none}
.cov{width:1920px;height:1080px;background-size:cover;background-position:center;transform-origin:50% 50%}
/* 遮罩上推的大标题：每段文字从各自行框的下沿推上来，不整屏闪 */
.hl{font-weight:900;line-height:1.08;white-space:nowrap;will-change:auto}
.hl-line{display:block;overflow:hidden;padding:0 .04em .06em 0}
.hl-line span{display:inline-block;transform:translateY(110%)}
.tag{display:flex;align-items:center;gap:18px;font-size:26px;white-space:nowrap}
.tag b{font:600 22px/1 "PT Mono",Menlo,monospace;letter-spacing:.14em;padding:9px 14px;border:2px solid currentColor;border-radius:8px}
.tag span{opacity:.82}
/* 像素 Alice：盒子底边中点就是双脚中心 */
.spr{transform-origin:50% 100%}
.spr img,.spr svg{position:absolute;display:block}
.sticker img{filter:drop-shadow(6px 0 0 #fff) drop-shadow(-6px 0 0 #fff) drop-shadow(0 6px 0 #fff) drop-shadow(0 -6px 0 #fff) drop-shadow(0 18px 22px rgba(26,23,20,.28))}
.star{color:var(--gold)}.star svg{width:100%;height:100%;display:block}

/* ===== 以下组件按 src/ 真实界面移植，尺寸约为客户端的 2 倍，配色取金阁主题 ===== */
/* 对话窗口 */
.win{background:#FBFAF8;border-radius:30px;box-shadow:0 40px 110px rgba(40,30,20,.24),0 0 0 1px rgba(67,53,43,.07);overflow:hidden;display:flex;flex-direction:column}
.win-top{flex:none;height:66px;display:flex;align-items:center;gap:12px;padding:0 28px;border-bottom:1px solid rgba(67,53,43,.07);font-size:22px;color:var(--muted);background:rgba(255,255,255,.7)}
.win-top i{width:15px;height:15px;border-radius:50%;background:#E4DED6}
.win-top b{flex:1;text-align:center;font-weight:500;margin-right:66px}
.win-body{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:26px;padding:34px 40px;overflow:hidden}
.um{align-self:flex-end;max-width:82%;background:var(--accent);color:#fff;padding:18px 28px;border-radius:30px 30px 10px 30px;font-size:30px;line-height:1.5}
.am{display:flex;gap:18px;align-items:flex-start;max-width:94%}
.am>img{width:58px;height:58px;border-radius:50%;object-fit:cover;flex:none;background:#F2DDD8}
.am>div{font-size:30px;line-height:1.6;color:var(--text);padding-top:7px}
.am>div b{font-weight:600}
.dots{display:flex;gap:10px;padding:24px 4px}.dots i{width:13px;height:13px;border-radius:50%;background:#BFB1A0}
.glass{background:rgba(255,252,247,.8);backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);border:1px solid rgba(255,255,255,.6);box-shadow:0 30px 80px rgba(20,14,8,.28);border-radius:30px;padding:26px 30px}
/* 输入框 */
.cmp{background:#fff;border-radius:34px;box-shadow:0 24px 70px rgba(67,53,43,.14),0 0 0 1px rgba(67,53,43,.08);padding:30px 34px 22px}
.cmp-t{font-size:34px;line-height:1.5;color:var(--text);height:51px;white-space:nowrap;overflow:hidden}
.cmp-t .ph{color:rgba(101,86,75,.45)}
.cmp-t .caret{display:inline-block;width:3px;height:40px;background:var(--accent);vertical-align:-7px;margin:0 3px}
.cmp-bar{display:flex;align-items:center;gap:24px;margin-top:20px;color:rgba(101,86,75,.55)}
.cmp-send{margin-left:auto;width:64px;height:64px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center}
.cmp-send.off{background:#ECE6DE;color:#fff}
/* 会话列表 */
.side{display:flex;flex-direction:column;gap:12px}
.side div{font-size:26px;color:var(--muted);padding:16px 22px;border-radius:16px;white-space:nowrap}
.side div:nth-child(3n+1){background:rgba(153,127,91,.1);color:var(--accent-ink)}
.brand{display:flex;flex-direction:column;align-items:center;gap:22px}
.brand img{width:132px;height:132px;border-radius:50%;object-fit:cover;box-shadow:0 14px 34px rgba(67,53,43,.18)}
.brand b{font-size:52px;color:var(--text)}
/* 请求列表 */
.feed-i{height:196px;display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.feed-ok{align-self:flex-start;display:flex;align-items:center;gap:14px;font-size:28px;color:var(--accent-ink);font-weight:600}
.feed-ok img{width:48px;height:48px;border-radius:50%;object-fit:cover}
/* 生图占位，移植 chat.css .image-gen-ph */
.igph{position:relative;isolation:isolate;overflow:hidden;border-radius:36px;border:1px solid rgba(67,53,43,.08);background:#FCFBF9;flex:none}
.igph .bl{position:absolute;width:80%;height:80%;border-radius:50%;filter:blur(46px);opacity:.85}
.igph .gr{position:absolute;inset:0;opacity:.45;mix-blend-mode:soft-light;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.igph .gl{position:absolute;top:-30%;bottom:-30%;left:-60%;width:80%;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%)}
.igph .chip{position:absolute;top:20px;left:20px;padding:8px 18px;border-radius:999px;font-size:20px;color:rgba(101,86,75,.85);background:rgba(255,255,255,.55);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.6)}
.igph .lab{position:absolute;left:20px;right:20px;bottom:20px;padding:18px 22px;border-radius:26px;background:rgba(255,255,255,.62);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.7)}
.igph .lab p{font-size:21px;line-height:1.45;color:rgba(67,53,43,.82);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.igph .st{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:20px;color:var(--muted)}
.igph .st i{width:12px;height:12px;border-radius:50%;background:var(--accent)}
.igph .st small{margin-left:auto;font-size:18px;color:rgba(101,86,75,.6)}
.imgc{border-radius:30px;overflow:hidden;background:#fff;box-shadow:0 30px 90px rgba(0,0,0,.3)}
.imgc>div{background-size:cover;background-position:center}
.credit{display:inline-flex;align-items:center;gap:12px;padding:8px 20px 8px 8px;border-radius:999px;background:rgba(153,127,91,.12);color:var(--accent-ink);font-size:24px;font-weight:600;white-space:nowrap}
.credit img{width:44px;height:44px;border-radius:50%;object-fit:cover}
.credit.dk{background:rgba(255,255,255,.12);color:#F3E6CC}
/* 原创歌曲卡 */
.mc{overflow:hidden;width:1000px;border-radius:40px;background:rgba(255,255,255,.92);box-shadow:0 30px 90px rgba(0,0,0,.3),0 0 0 1px rgba(255,255,255,.5);padding:40px;color:var(--text)}
.mc .bloom{position:absolute;border-radius:50%;filter:blur(60px)}
.mc-row{position:relative;display:flex;gap:36px;align-items:center}
.mc-art{position:relative;width:240px;height:160px;flex:none}
.vinyl{position:absolute;left:84px;top:8px;width:144px;height:144px;border-radius:50%;background:repeating-radial-gradient(circle,#2a2525 0 2px,#171414 2px 4px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.vinyl i{position:absolute;inset:46px;border-radius:50%;background:linear-gradient(145deg,#F6B75E,#E98555 52%,#C95B79)}
.vinyl i::after{content:"";position:absolute;inset:20px;border-radius:50%;background:#171414}
.vinyl::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(130deg,rgba(255,255,255,.18),transparent 40%)}
.cover{position:absolute;left:0;top:0;width:160px;height:160px;border-radius:32px;background:linear-gradient(145deg,#F6B75E,#E98555 52%,#C95B79);box-shadow:0 18px 40px rgba(201,91,121,.35);overflow:hidden;display:flex;align-items:center;justify-content:center}
.cover::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.5),transparent 46%)}
.cover b{position:relative;width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;color:#fff}
.mc h3{font-size:40px;font-weight:700}
.mc .meta{font:22px "PT Mono",Menlo,monospace;color:#8A7B6E;margin-top:8px}
.tags{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px;font-size:21px;color:var(--muted)}
.tags span{padding:6px 16px;border-radius:999px;background:rgba(67,53,43,.06)}
.tags span.ac{background:rgba(153,127,91,.14);color:var(--accent-ink);font-weight:600}
.mc-player{position:relative;display:flex;align-items:center;gap:26px;margin-top:30px;padding:20px 26px;border-radius:32px;background:rgba(248,246,243,.85);border:1px solid rgba(67,53,43,.06)}
.mc-play{width:80px;height:80px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 10px 24px rgba(153,127,91,.35)}
.wave{flex:1;height:58px;display:flex;align-items:center;gap:4px}
.wave i{flex:1;border-radius:3px;background:rgba(67,53,43,.16)}
.wave i.on{background:var(--accent)}
.mc-time{font:20px "PT Mono",Menlo,monospace;color:#8A7B6E;white-space:nowrap}
.mc-foot{position:relative;display:flex;align-items:center;gap:14px;margin-top:22px;font-size:21px;color:#8A7B6E}
.mc-foot span{padding:8px 18px;border-radius:999px;border:1px solid rgba(67,53,43,.12);color:var(--muted)}
.mc-foot span:first-of-type{margin-left:auto}
/* 小说写作进度面板，移植 novel-floating-panel */
.np{width:1000px;border-radius:32px;background:rgba(255,255,255,.97);box-shadow:0 30px 90px rgba(0,0,0,.3);overflow:hidden;color:#1F2937}
.np-head{display:flex;align-items:center;gap:16px;padding:28px 32px 22px;white-space:nowrap}
.np-dot{position:relative;width:16px;height:16px;border-radius:50%;background:#3B82F6;flex:none}
.np-dot i{position:absolute;inset:0;border-radius:50%;background:#60A5FA}
.np-head b{font-size:28px;font-weight:600}
.np-head small{font-size:22px;color:#9CA3AF}
.np-chip{font-size:20px;padding:5px 14px;border-radius:999px;background:#EFF6FF;color:#2563EB;font-weight:600}
.np-chip.ok{background:#ECFDF5;color:#059669}
.np-stat{margin-left:auto;display:flex;gap:18px;font-size:22px;color:#4B5563}
.np-stat em{font-style:normal;color:#3B82F6}
.np-bar{height:6px;background:#F3F4F6}.np-bar i{display:block;height:100%;background:linear-gradient(90deg,#60A5FA,#2563EB)}
.np-steps{display:flex;justify-content:space-between;padding:26px 54px 6px}
.np-step{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:19px;color:#9CA3AF}
.np-step i{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#F3F4F6;font-style:normal;font-size:20px}
.np-step.done{color:#059669}.np-step.done i{background:#D1FAE5}
.np-step.cur{color:#2563EB;font-weight:600}.np-step.cur i{background:#EFF6FF;box-shadow:0 0 0 3px #93C5FD}
.np-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;padding:22px 32px 16px}
.np-grid i{aspect-ratio:1;border-radius:12px;background:#F3F4F6;display:flex;align-items:center;justify-content:center;font:600 20px "PT Mono",Menlo,monospace;color:#9CA3AF;font-style:normal}
.np-grid i.done{background:#34D399;color:#fff}
.np-grid i.cur{background:#DBEAFE;color:#2563EB;box-shadow:0 0 0 3px #60A5FA}
.np-foot{display:flex;align-items:center;gap:12px;padding:6px 32px 30px;font-size:20px;color:#6B7280}
.np-foot span{padding:8px 18px;border-radius:12px;background:#F9FAFB;border:1px solid #E5E7EB}
.np-foot em{margin-left:auto;font-style:normal;display:flex;gap:30px;text-align:center;font-size:17px;color:#9CA3AF}
.np-foot em b{display:block;font-size:28px;color:#111827;font-weight:600}
/* 塔罗三张牌，移植 TarotSpreadCard */
.tr{width:900px;border-radius:32px;background:rgba(23,18,38,.97);box-shadow:0 0 0 1px rgba(196,181,253,.15),0 30px 90px rgba(0,0,0,.5);padding:34px 44px 40px;color:#EDE9FE;overflow:hidden}
.tr-q{font-size:27px;color:rgba(237,233,254,.88)}.tr-q span{color:rgba(196,181,253,.6);margin-right:14px}
.tr-s{font-size:22px;color:rgba(221,214,254,.42);margin-top:8px}
.tr-cards{display:flex;justify-content:center;gap:36px;margin-top:30px}
.tc{width:200px;text-align:center}
.tc-f{position:relative;width:200px;height:300px;perspective:1200px}
.tc-in{position:absolute;inset:0;transform-style:preserve-3d}
.tc-in>div{position:absolute;inset:0;border-radius:14px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 0 0 2px rgba(253,230,138,.35),0 14px 30px rgba(0,0,0,.5)}
.tc-in>div img{width:100%;height:100%;object-fit:cover}
.tc-in .fr{transform:rotateY(180deg)}
.tc b{display:block;margin-top:16px;font-size:24px;font-weight:500;color:rgba(254,243,199,.9)}
.tc small{font-size:20px;color:rgba(221,214,254,.5)}
/* 相面推断卡，移植 FaceReadingCard */
.frc{width:760px;border-radius:32px;background:rgba(255,255,255,.93);box-shadow:0 30px 90px rgba(120,60,60,.2),0 0 0 1px rgba(67,53,43,.05);padding:34px 40px;color:var(--text)}
.frc-h{display:flex;align-items:center;gap:12px;font-size:30px;font-weight:600;color:var(--accent-ink);margin-bottom:8px}
.frc-r{display:flex;gap:24px;padding:16px 0;border-bottom:1px solid rgba(67,53,43,.07);font-size:27px}
.frc-r span{width:150px;flex:none;color:#8A7B6E}
.frc-r b{font-weight:500}
.frc-n{margin-top:16px;font-size:21px;color:#A3958A}
.frc-b{position:relative;display:flex;gap:16px;margin-top:22px;height:58px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:0 26px;height:58px;border-radius:999px;font-size:24px;border:1px solid rgba(67,53,43,.14);color:var(--muted);white-space:nowrap}
.btn.pri{background:var(--accent);color:#fff;border-color:transparent}
.btn.ok{background:rgba(143,162,122,.18);color:#5E7350;border-color:transparent;position:absolute;right:0;top:0}
.chip{padding:14px 26px;border-radius:999px;background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.8);box-shadow:0 14px 36px rgba(120,60,60,.14);font-size:26px;color:var(--text);white-space:nowrap}
.chip.k{background:rgba(194,85,102,.12);color:#9C3F50;border-color:transparent}
/* 新朋友建联卡，移植 apps/opc-summon */
.opc{width:1000px;height:620px;border-radius:36px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.4);background-size:cover;background-position:center}
.opc-dim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,22,16,.1),rgba(30,22,16,.55))}
.opc-say{position:absolute;left:36px;top:32px;display:flex;gap:14px;align-items:center;padding:10px 26px 10px 10px;border-radius:999px;background:rgba(255,250,243,.82);backdrop-filter:blur(14px);font-size:24px;color:var(--text)}
.opc-say img{width:48px;height:48px;border-radius:50%;object-fit:cover}
.opc-card{position:absolute;left:36px;right:36px;bottom:36px;display:flex;gap:30px;padding:28px;border-radius:28px;background:rgba(255,250,243,.86);backdrop-filter:blur(18px);color:var(--text)}
.opc-card>img{width:200px;height:200px;border-radius:24px;object-fit:cover;flex:none}
.opc-card h4{font-size:46px;font-weight:900}
.opc-card .m{font-size:21px;color:#8A7B6E;margin-top:6px}
.opc-card .q{font-size:25px;margin-top:12px;color:var(--text)}
.opc-card .cp{font-size:21px;color:#8A7B6E;margin-top:10px}
.opc-go{position:absolute;right:28px;bottom:28px;padding:14px 32px;border-radius:999px;background:var(--ink);color:#F3E6CC;font-size:24px;letter-spacing:.2em}
.opc-ok{position:absolute;left:50%;top:120px;transform:translateX(-50%);padding:14px 30px;border-radius:999px;background:rgba(143,162,122,.92);color:#fff;font-size:24px;white-space:nowrap}
/* 朋友圈动态 */
.pc{width:760px;border-radius:32px;background:#fff;box-shadow:0 30px 90px rgba(67,53,43,.22);padding:30px 34px;color:var(--text)}
.pc-h{display:flex;align-items:center;gap:16px}
.pc-h img{width:66px;height:66px;border-radius:50%;object-fit:cover}
.pc-h b{display:block;font-size:28px}
.pc-h small{font-size:20px;color:#A3958A}
.pc-h em{margin-left:auto;font-style:normal;font-size:20px;padding:6px 16px;border-radius:999px;background:rgba(143,162,122,.16);color:#5E7350}
.pc p{font-size:26px;line-height:1.6;margin-top:18px}
.pc-img{margin-top:18px;height:330px;border-radius:20px;background-size:cover;background-position:center}
.pc-loc{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:21px;color:#8A7B6E}
.pc-act{display:flex;gap:28px;justify-content:flex-end;margin-top:-30px;color:#A3958A}
.pc-like{display:flex;align-items:center;gap:6px;margin-top:16px;padding:12px 18px 12px 30px;border-radius:18px 18px 0 0;background:#F6F3EE;font-size:22px;color:var(--accent-ink);height:70px}
.pc-like img{width:46px;height:46px;border-radius:50%;object-fit:cover;border:3px solid #F6F3EE;margin-left:-14px}
.pc-like span{margin-left:12px}
.pc-cm{padding:8px 18px 12px;background:#F6F3EE;font-size:23px;line-height:1.5}
.pc-cm:last-child{border-radius:0 0 18px 18px;padding-bottom:16px}
.pc-cm b{color:var(--accent-ink);font-weight:600}
/* 旅行手账 */
.tb{width:1000px;height:640px;border-radius:30px;background-size:cover;background-position:center;box-shadow:0 30px 90px rgba(0,0,0,.4);overflow:hidden}
.pol{position:absolute;background:#fff;padding:14px 14px 56px;box-shadow:0 16px 34px rgba(0,0,0,.32)}
.pol div{background-size:cover;background-position:center}
.pol i{position:absolute;width:120px;height:34px;background:rgba(255,248,225,.75);top:-16px;left:50%;margin-left:-60px;transform:rotate(-5deg)}
.tb-h{position:absolute;left:30px;top:26px;padding:10px 24px;border-radius:999px;background:rgba(255,255,255,.88);font-size:24px;color:var(--text)}
/* 来电 */
.call{width:620px;height:880px;border-radius:60px;overflow:hidden;box-shadow:0 50px 120px rgba(0,0,0,.55),0 0 0 10px #15120f}
.call-bg{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(26px) saturate(1.1)}
.call-dim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,16,12,.3),rgba(20,16,12,.62))}
.call-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:150px;color:#fff}
.call-av{position:relative;width:220px;height:220px}
.call-av img{position:relative;width:220px;height:220px;border-radius:50%;object-fit:cover;border:6px solid rgba(255,255,255,.85)}

/*

const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const prog = (t, a, d) => clamp((t - a) / d);
const eOut = p => 1 - Math.pow(1 - p, 3);
const eIO = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eBack = p => { const c = 1.7; return p <= 0 ? 0 : 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
const beatPhase = t => (((t - PHASE) % BEAT) + BEAT) % BEAT;
const beatPulse = t => Math.exp(-beatPhase(t) * 9);
const beatIndex = t => Math.floor((t - PHASE) / BEAT);
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

const shake = calm ? 0 : 1;
/** 视差漂移速度（像素/秒）。系统开启减少动态效果时整体减半。 */
const V = calm ? 0.5 : 1;

const canvas = document.getElementById('canvas');
function h(parent, cls = '', css = '', html = '') {
  const e = document.createElement('div');
  if (cls) e.className = cls;
  if (css) e.style.cssText = css;
  if (html) e.innerHTML = html;
  parent.appendChild(e);
  return e;
}
function im(parent, src, css = '', cls = 'c') {

  e.src = src; e.alt = ''; e.draggable = false; e.className = cls; e.style.cssText = css;

}
const bgUrl = src => `background-image:url(${src})`;
/** 以中心点定位，所有坐标都在 1920×1080 设计画布内。 */
function place(e, x, y, s = 1, r = 0, o = 1) {
  e.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%) rotate(${r}deg) scale(${s})`;
  e.style.opacity = o;
}
/** 上浮淡入：t0 之前隐藏且不占位，之后 d 秒内从 dy 像素下方升到原位。用于流式布局里的消息。 */
function rise(e, t, t0, d = 0.3, dy = 26, until = Infinity) {
  const on = t >= t0 && t < until;
  e.style.display = on ? '' : 'none';
  if (!on) return 0;
  const p = eOut(prog(t, t0, d));
  e.style.opacity = p;
  e.style.transform = `translateY(${(1 - p) * dy}px)`;
  return p;
}
/** 封面背景：带缓慢推拉（ken burns）。 */
function cover(parent, src, css = '') { return h(parent, 'c cov', bgUrl(src) + ';' + css); }
function kb(e, t, t0, s0 = 1.08, ds = -0.02, vx = -14, vy = 0) {

/** 镜头列表：当前镜头从右向左擦入，上一镜头留在下面直到擦完。d 为 0 时硬切。 */
function shots(list, t, d = 0.2) {
  let cur = 0;
  list.forEach((o, i) => { if (t >= o.at) cur = i; });
  const wiping = d > 0 && cur > 0 && t < list[cur].at + d;
  list.forEach((o, i) => {
    const on = i === cur || (wiping && i === cur - 1);
    o.s.style.display = on ? 'block' : 'none';
    o.s.style.zIndex = i === cur ? 2 : 1;
    o.s.style.clipPath = i === cur && wiping ? `inset(0 0 0 ${(1 - eOut(prog(t, list[cur].at, d))) * 100}%)` : 'none';
  });

}

/* ---------- 标题 ---------- */
/** lines = [[[at, text, color], ...], ...]。返回 {box, parts}，配合 drawHL。 */
function headline(parent, x, y, size, lines, color, css = '') {
  const box = h(parent, 'c song hl', `left:${x}px;top:${y}px;font-size:${size}px;color:${color};${css}`);
  const parts = [];
  lines.forEach(line => {
    const row = h(box, 'hl-line');
    line.forEach(([at, text, col]) => {
      const s = document.createElement('span');
      s.textContent = text;
      if (col) s.style.color = col;
      row.appendChild(s);
      parts.push({ at, s });

/** 按歌词逐词生成标题；breaks 是另起一行的词序号，accent 给指定词换色。 */

function drawHL(o, t, d = 0.14) {

/** 卡拉 OK：每个字到点从暗变亮，用在主歌这类长句。lines 为每行字数。 */

function groove(t, seq, opt = {}) {

  end.innerHTML = `<div style="display:flex;align-items:baseline;gap:30px"><span class="song" style="font-size:170px;font-weight:900;color:${C.text}">白艾莉</span><span class="latin" style="font-size:120px;font-style:italic;color:${C.rose}">Alice.</span></div><div class="song" style="font-size:56px;color:${C.text};margin-top:20px">能说悄悄话的饭搭子</div><div class="song" style="font-size:36px;color:${C.muted};margin-top:20px">世界在往前赶，她在等你说话。</div>`;
  const row = h(end, 'strip', 'margin-top:56px');
  const avs = [...ROLL.map(id => im(row, AV(id), '', '')), h(row, 'plus', 'width:62px;height:62px;font-size:34px', '＋')];
  h(end, 'mono', `margin-top:44px;font-size:30px;letter-spacing:.3em;color:${C.accent}`, 'ALICE.FANS');
  return { cut, hs, hl, end, avs };
}, (t, c) => {
  const d = t - 41.42;
  /* 「接」张开手，「你」落下时比心，片尾挥手道别 */
  cue(c.cut, t, [[41.42, 'wave'], [42.38, 'catch'], [43.16, 'heart'], [43.7, 'wave']], 540 - Math.min(d, 3) * 14 * V, 1050);
  drawRise(c.hs, t, 43.16, 540, 520, 300);
  drawHL(c.hl, t);
  const out = prog(t, 43.3, 0.25);
  c.hl.box.style.opacity = 1 - out;
  c.hl.box.style.transform = `translateY(${-out * 40}px)`;
  const pe = eOut(prog(t, 43.42, 0.5));
  c.end.style.opacity = pe;
  c.end.style.transform = `translateY(${(1 - pe) * 40}px)`;
  c.avs.forEach((e, i) => { const p = eBack(prog(t, 43.7 + i * 0.03, 0.25)); e.style.transform = `scale(${p})`; });
});

/*
 * 快闪字卡：一句一张卡，底色按句换；同一张卡上词按演唱时间依次砸出，JK Alice 跟着换动作。
 * 每张停 0.5–1.4 秒，只用墨色、玫瑰、金三种底色，进出硬切，不闪白、不抖屏。
 * [开始, 结束, 底色, 字色, 每行的词 [[时间, 字], ...], 动作 [[时间, 动作], ...], 字号, 歌词行]
 */
const FLASH = [
  [0.94, 1.90, C.ink, C.white, [[[0.94, '当然']], [[1.48, '可以，']]], [[0.94, 'wave'], [1.48, 'present']], 280, 0],
  [3.94, 5.30, C.rose, C.white, [[[3.94, '当然']], [[4.70, '可以，']]], [[3.94, 'cheer'], [4.70, 'peace']], 280, 1],
  [10.78, 11.30, C.gold, C.ink, [[[10.78, '你。']]], [[10.78, 'heart']], 380, 3],
  [32.72, 33.40, C.ink, C.white, [[[32.72, '接'], [32.92, '住'], [33.12, '你。', C.rose]]], [[32.72, 'catch'], [33.12, 'heart']], 280, 14],
  [33.80, 34.40, C.rose, C.white, [[[33.80, '当然']], [[34.00, '可以，']]], [[33.80, 'wave'], [34.00, 'jump']], 280, 15],
  [42.38, 43.16, C.ink, C.white, [[[42.38, '接'], [42.70, '住']]], [[42.38, 'catch'], [42.70, 'cheer']], 340, 17],
];
const flashLayer = h(canvas, 'scene', 'z-index:40;display:block;pointer-events:none');
const flashes = FLASH.map(([a, b, bg, fg, lines, poses, size, li]) => {
  const el = h(flashLayer, 'scene', `background:${bg}`);
  const line = LYRICS[li].w.map(w => w[1]).join('');
  const stroke = fg === C.white ? 'rgba(255,255,255,.12)' : 'rgba(67,53,43,.12)';
  const rows = [150, 790].map(y => h(el, 'c song', `top:${y}px;font-size:220px;font-weight:900;color:transparent;-webkit-text-stroke:2px ${stroke};white-space:nowrap`, (line + '\u2003').repeat(6)));
  const box = h(el, 'c song', `left:150px;top:50%;font-size:${size}px;font-weight:900;line-height:1.08;color:${fg};white-space:nowrap`);
  const parts = [];
  lines.forEach(ln => {
    const row = h(box, '');
    ln.forEach(([at, text, col]) => { const sp = document.createElement('span'); sp.textContent = text; sp.style.display = 'inline-block'; if (col) sp.style.color = col; row.appendChild(sp); parts.push({ at, s: sp }); });
  });
  const g = jk(el, 640, poses[0][1]);
  return { a, b, el, rows, box, parts, g, poses };
});
function drawFlash(t) {
  flashes.forEach(f => {
    const on = t >= f.a && t < f.b;
    f.el.style.display = on ? 'block' : 'none';
    if (!on) return;
    const d = t - f.a;
    f.rows[0].style.transform = `translateX(${-300 - d * 260 * V}px)`;
    f.rows[1].style.transform = `translateX(${-900 + d * 260 * V}px)`;
    f.box.style.transform = 'translateY(-50%)';
    f.parts.forEach(p => {
      const q = eOut(prog(t, p.at, 0.12));
      p.s.style.opacity = t >= p.at ? 1 : 0;
      p.s.style.transform = `scale(${lerp(1.25, 1, q)})`;
    });
    cue(f.g, t, f.poses, 1560, 1050, 1, f.a - 1);
  });
}
/* 切镜推进：镜头切换的那一刻画面放大 4%，0.16 秒内回到原样。只在切点发生，不按拍持续顶。 */
const CUTS = [...new Set([
  ...FLASH.flatMap(f => [f[0], f[1]]),
  ...HERE.map(o => o[0]), 7.14, 7.42,
  ...HITS.map(w => w[0]),
  ...ROLL_T.slice(0, SOLO + 1), 38.86,
  ...QUAD.map(o => o[0]),
  0.94, 2.9, 6.6, 8.96, 11.3, 13.72, 17.06, 18.64, 20.6, 22.06, 23.66, 25.48, 26.44, 29.68, 31.98, 33.8, 35.2, 39.42, 41.42, 43.42,
])].sort((a, b) => a - b);
function punch(t) {
  let last = -9;
  for (const c of CUTS) { if (c <= t) last = c; else break; }
  const p = prog(t, last, 0.16);
  return p < 1 ? 1 + 0.04 * (1 - eOut(p)) * shake : 1;
}

/* 杂志式信息框、字幕、调试信息 */
const hud = h(canvas, 'hud', '', '<div class="k k1"></div><div class="k k2"></div><div class="k k3"></div><div class="k k4"></div><div class="tl">ALICE.FANS</div><div class="tr2">N°01 · 当然可以，好问题</div><div class="bl">TC 00:00.00</div><div class="br"><i></i><i></i><i></i><i></i><span>&nbsp;150 BPM</span></div>');
const hudTC = hud.querySelector('.bl'), hudBeats = [...hud.querySelectorAll('.br i')];
const caption = h(canvas, 'caption song');
const debug = h(canvas, 'debug');
let capLine = -1, captionsOn = params.get('captions') === '1';
function drawCaption(t) {
  let li = -1;
  LYRICS.forEach((l, i) => { if (t >= l.w[0][0] - 0.1 && t < l.end) li = i; });
  const show = captionsOn && li >= 0 && t < 43.4;
  caption.style.opacity = show ? 1 : 0;
  if (li < 0) return;
  if (li !== capLine) { capLine = li; caption.innerHTML = LYRICS[li].w.map(([, w]) => `<i>${w}</i>`).join(''); }
  [...caption.children].forEach((e, i) => e.classList.toggle('on', t >= LYRICS[li].w[i][0]));
}

const audio = document.getElementById('audio');
const $ = id => document.getElementById(id);
const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
let raf = 0, current = '';
function render(t = audio.currentTime || 0) {
  const k = punch(t);
  for (const s of scenes) {
    const on = t >= s.a && t < s.b;
    s.el.style.display = on ? 'block' : 'none';
    if (!on) continue;
    s.el.style.transform = k === 1 ? '' : `scale(${k})`;
    s.draw(t, s.ctx, s.el);
    current = s.id;
  }
  if (t < 0) scenes[0].el.style.display = 'block';
  drawFlash(t);
  flashLayer.style.transform = k === 1 ? '' : `scale(${k})`;
  const tc = Math.max(0, t);
  hudTC.textContent = `TC 00:${String(Math.floor(tc)).padStart(2, '0')}.${String(Math.floor((tc % 1) * 100)).padStart(2, '0')}`;
  const bi = beatIndex(t);
  hudBeats.forEach((e, i) => e.classList.toggle('on', ((bi % 4) + 4) % 4 === i));
  hud.style.opacity = t >= 43.4 ? 1 - prog(t, 43.4, 0.3) : 1;
  drawCaption(t);
  if (params.has('debug')) { debug.style.display = 'block'; debug.textContent = t.toFixed(2) + 's · ' + current; }
  const d = Number.isFinite(audio.duration) ? audio.duration : DURATION;
  $('seek').value = t;
  $('time').textContent = fmt(t) + ' / ' + fmt(d);
}
function tick() { render(); if (!audio.paused) raf = requestAnimationFrame(tick); }

const frame = $('frame');
function fit() {
  const k = frame.clientWidth / 1920, kh = frame.clientHeight / 1080, s = Math.min(k, kh);
  canvas.style.transform = `translate(${(frame.clientWidth - 1920 * s) / 2}px,${(frame.clientHeight - 1080 * s) / 2}px) scale(${s})`;
}
new ResizeObserver(fit).observe(frame);
fit();

/** 预加载：页面里出现过的全部图片，外加当前衣服的像素 Alice。 */
function preload() {
  const list = new Set([...document.querySelectorAll('#canvas img')].map(i => i.src));
  document.querySelectorAll('#canvas [style*="background-image"]').forEach(e => { const m = /url\("?([^")]+)"?\)/.exec(e.style.backgroundImage); if (m) list.add(new URL(m[1], location.href).href); });
  if (META[outfit]) Object.keys(META[outfit]).forEach(p => list.add(new URL(`sprites/${outfit}/alice_${p}.svg`, location.href).href));
  const all = [...list];
  let done = 0, failed = 0;
  return Promise.race([
    Promise.all(all.map(src => new Promise(res => {
      const i = new Image();
      i.onload = () => { done++; $('play').textContent = `加载 ${Math.round(done / all.length * 100)}%`; res(); };
      i.onerror = () => { failed++; res(); };
      i.src = src;
    }))),
    new Promise(res => setTimeout(res, 15000)),
  ]).then(() => failed);
}

$('play').onclick = async () => {
  if (!audio.paused) { audio.pause(); return; }
  try { if (audio.ended || audio.currentTime >= DURATION - 0.05) audio.currentTime = 0; await audio.play(); }
  catch (e) { $('status').textContent = '无法播放音频：' + (e && e.message ? e.message : '浏览器拒绝了播放请求'); $('load').hidden = false; }
};
audio.addEventListener('play', () => { cancelAnimationFrame(raf); $('play').textContent = '暂停'; tick(); });
audio.addEventListener('pause', () => { cancelAnimationFrame(raf); $('play').textContent = '播放'; render(); });
audio.addEventListener('ended', () => { $('play').textContent = '重播'; render(DURATION); });
audio.addEventListener('loadedmetadata', () => { if (Number.isFinite(audio.duration)) $('seek').max = audio.duration; render(); });
audio.addEventListener('seeked', () => render());
audio.addEventListener('error', () => { $('status').textContent = '没有找到 assets/song.mp3，可以点「导入音频」手动选择歌曲。'; $('load').hidden = false; });
$('seek').oninput = () => { audio.currentTime = Number($('seek').value); render(Number($('seek').value)); };
$('cc').onclick = () => { captionsOn = !captionsOn; $('cc').setAttribute('aria-pressed', String(captionsOn)); render(); };
$('fs').onclick = async () => {
  try { if (document.fullscreenElement) await document.exitFullscreen(); else await frame.requestFullscreen(); }
  catch (e) { $('status').textContent = '当前浏览器不支持页面全屏，请使用浏览器自带的全屏。'; }
};
/* 换装：按 OUTFIT_NAMES 顺序轮换，地址栏同步 ?outfit=，刷新后保持 */
$('outfit').onclick = () => {
  const keys = Object.keys(OUTFIT_NAMES).filter(k => META[k]);
  if (!keys.length) return;
  outfit = keys[(keys.indexOf(outfit) + 1) % keys.length];
  params.set('outfit', outfit);
  history.replaceState(null, '', '?' + params.toString());
  $('outfit').textContent = '换装：' + OUTFIT_NAMES[outfit];
  ACTORS.forEach(b => b.set(b.want));
  render();
};
$('load').onclick = () => $('file').click();
let blobUrl = null;
$('file').onchange = () => {
  const f = $('file').files[0];
  if (!f) return;
  audio.pause();
  if (blobUrl) URL.revokeObjectURL(blobUrl);
  blobUrl = URL.createObjectURL(f);
  audio.src = blobUrl; audio.load();
  $('status').textContent = '已导入：' + f.name;
};
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
  if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { e.preventDefault(); audio.currentTime = clamp(audio.currentTime + (e.code === 'ArrowRight' ? 1 : -1), 0, DURATION); render(); }
});
$('outfit').textContent = '换装：' + OUTFIT_NAMES[outfit];
$('cc').setAttribute('aria-pressed', String(captionsOn));
if (params.get('embed') === '1') document.body.classList.add('embed');

if (!window.SPRITE_META) $('status').textContent = '没有找到 sprites/sprites.js，像素 Alice 无法显示。';
preload().then(failed => {
  $('play').disabled = false;
  $('play').textContent = '播放';
  if (failed) $('status').textContent = `有 ${failed} 张图片没有加载成功，画面会缺图，请检查 assets 与 sprites 目录。`;
  const freeze = params.get('t');
  const go = () => { render(freeze === null ? 0 : Number(freeze)); document.body.dataset.ready = '1'; };
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(go));
});
render(0);
</script>
</body>
</html>
