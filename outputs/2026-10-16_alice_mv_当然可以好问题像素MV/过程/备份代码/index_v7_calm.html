<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14120f">
<title>当然可以，好问题 · 白艾莉 Alice</title>
<style>
:root{--paper:#FAFAF7;--card:#F5F3EE;--line:#E8E4DC;--ink:#1A1714;--text:#43352B;--muted:#6B6460;--accent:#997F5B;--accent-ink:#7E6E4D;--rose:#C25566;--gold:#C9A96E;--sage:#8FA27A;--night:#1F2A44}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#14120f;color:var(--ink);font-family:Inter,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
.song{font-family:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif}
.latin{font-family:"Playfair Display",Georgia,"Times New Roman",serif}
.mono{font-family:"PT Mono",Menlo,monospace}
.app{height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.frame{position:relative;width:min(100%,calc((100svh - 100px)*16/9));aspect-ratio:16/9;overflow:hidden;background:var(--paper);border-radius:10px;box-shadow:0 30px 90px #0007}
.frame:fullscreen{width:100vw;height:100vh;border-radius:0;aspect-ratio:auto;display:flex;align-items:center;background:#000}
#canvas{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--paper)}
.scene{position:absolute;inset:0;display:none;overflow:hidden;transform-origin:50% 50%}
.c{position:absolute;left:0;top:0;will-change:transform,opacity}
img{display:block;user-select:none;-webkit-user-drag:none}
.big{font-weight:900;line-height:1;white-space:nowrap}
/* 像素 Alice：盒子底边中点就是双脚中心，挤压、旋转、翻转都绕脚底进行 */
.spr{transform-origin:50% 100%}
.spr img,.spr svg{position:absolute;display:block}
.sticker img{filter:drop-shadow(6px 0 0 #fff) drop-shadow(-6px 0 0 #fff) drop-shadow(0 6px 0 #fff) drop-shadow(0 -6px 0 #fff) drop-shadow(0 18px 22px rgba(26,23,20,.28))}
/* 聊天窗口 */
.chat{background:#fff;border-radius:32px;box-shadow:0 30px 80px rgba(26,23,20,.16),0 0 0 1px var(--line);padding:34px 44px;display:flex;flex-direction:column;gap:30px}
.chat-head{display:flex;align-items:center;gap:20px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.chat-head img{width:76px;height:76px;border-radius:50%;object-fit:cover;object-position:50% 18%;background:var(--card)}
.chat-head b{display:block;font-size:30px;color:var(--ink)}
.chat-head span{font-size:22px;color:var(--sage)}
.chat-head span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--sage);margin-right:8px;vertical-align:1px}
.bubble{max-width:84%;padding:22px 32px;border-radius:30px;font-size:36px;line-height:1.35}
.bubble.me{align-self:flex-end;background:#EFEFEB;border-bottom-right-radius:8px}
.bubble.her{align-self:flex-start;background:var(--card);border:1px solid var(--line);font-size:88px;font-weight:700;border-bottom-left-radius:8px;white-space:nowrap}
.chat.mini{padding:22px 28px;gap:18px;border-radius:24px}
.chat.mini .chat-head{padding-bottom:14px;gap:14px}.chat.mini .chat-head img{width:52px;height:52px}.chat.mini .chat-head b{font-size:22px}.chat.mini .chat-head span{font-size:16px}
.chat.mini .bubble.her{font-size:46px;padding:16px 24px}
.notif{background:#fff;border-radius:34px;padding:30px 42px;display:flex;gap:26px;align-items:center;box-shadow:0 34px 90px rgba(0,0,0,.45);white-space:nowrap}
.notif .av{width:96px;height:96px;border-radius:50%;background:#F2DDD8;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;color:var(--rose);flex:none}
.notif small{display:block;font-size:26px;color:var(--muted);margin-bottom:6px}
.notif p{font-size:56px;font-weight:700;color:var(--ink)}
.task{width:600px;background:#fff;border-radius:28px;padding:30px 36px;box-shadow:0 30px 70px rgba(26,23,20,.28)}
.task small{display:block;font-size:24px;color:var(--muted);margin-bottom:12px}
.task p{font-size:62px;font-weight:700;color:var(--ink)}
.task .ok{display:flex;align-items:center;gap:12px;margin-top:18px;font-size:28px;color:var(--sage);font-weight:600}
.task .ok svg{width:40px;height:40px}
.ticker{white-space:nowrap;font-weight:900;font-size:64px;padding:18px 0;letter-spacing:.06em}
.mos{border-radius:18px;overflow:hidden;background-size:cover;background-position:50% 25%;box-shadow:0 10px 30px rgba(0,0,0,.22)}
.mos b{position:absolute;left:16px;bottom:14px;background:rgba(250,250,247,.92);color:var(--ink);font-size:24px;padding:6px 14px;border-radius:12px}
.fcard{display:flex;flex-direction:column;align-items:center;gap:18px}
.fcard img{width:280px;height:280px;border-radius:50%;object-fit:cover;object-position:50% 20%;border:12px solid #fff;box-shadow:0 20px 44px rgba(26,23,20,.18)}
.fcard span{background:var(--ink);color:#fff;font-size:30px;line-height:46px;padding:0 18px;border-radius:8px;white-space:nowrap}
.star{color:var(--gold)}
.star svg{width:100%;height:100%;display:block}
svg.i{display:block;flex:none}
.win{background:#FBFAF8;border-radius:30px;box-shadow:0 36px 90px rgba(26,23,20,.26),0 0 0 1px rgba(67,53,43,.08);overflow:hidden;display:flex;flex-direction:column}
.win-top{flex:none;height:62px;display:flex;align-items:center;gap:12px;padding:0 26px;border-bottom:1px solid rgba(67,53,43,.08);font-size:22px;color:var(--muted);background:rgba(255,255,255,.75)}
.win-top i{width:14px;height:14px;border-radius:50%;background:#E4DED6}
.win-top b{flex:1;text-align:center;font-weight:500;margin-right:60px}
.win-body{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:22px;padding:30px 36px;overflow:hidden}
.um{align-self:flex-end;max-width:82%;background:var(--accent);color:#fff;padding:16px 26px;border-radius:28px 28px 8px 28px;font-size:28px;line-height:1.5}
.am{display:flex;gap:16px;align-items:flex-start;max-width:94%}
.am>img{width:54px;height:54px;border-radius:50%;object-fit:cover;flex:none;background:#F2DDD8}
.am>div{font-size:28px;line-height:1.55;color:var(--text);padding-top:6px}
.am>div b{font-weight:600}
.side{display:flex;flex-direction:column;gap:10px}
.side div{font-size:23px;color:var(--muted);padding:14px 20px;border-radius:14px;white-space:nowrap;background:rgba(255,255,255,.55)}
.side div.on{background:rgba(194,85,102,.14);color:var(--rose);font-weight:600}
.igph{position:relative;isolation:isolate;overflow:hidden;border-radius:32px;border:1px solid rgba(67,53,43,.08);background:#FCFBF9;flex:none}
.igph .bl{position:absolute;width:80%;height:80%;border-radius:50%;filter:blur(42px);opacity:.85}
.igph .chip{position:absolute;top:18px;left:18px;padding:7px 16px;border-radius:999px;font-size:19px;color:rgba(101,86,75,.85);background:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.7)}
.igph .lab{position:absolute;left:18px;right:18px;bottom:18px;padding:16px 20px;border-radius:22px;background:rgba(255,255,255,.78)}
.igph .lab p{font-size:20px;line-height:1.4;color:var(--text)}
.igph .st{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:19px;color:var(--muted)}
.igph .st i{width:11px;height:11px;border-radius:50%;background:var(--accent)}
.imgc{border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.28)}
.imgc>div{background-size:cover;background-position:center}
.credit{display:inline-flex;align-items:center;gap:12px;padding:8px 20px 8px 8px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--ink);font-size:23px;font-weight:600;white-space:nowrap;box-shadow:0 12px 28px rgba(0,0,0,.18)}
.credit img{width:42px;height:42px;border-radius:50%;object-fit:cover}
.mc{overflow:hidden;width:960px;border-radius:36px;background:rgba(255,255,255,.95);box-shadow:0 30px 80px rgba(0,0,0,.28);padding:36px;color:var(--text)}
.mc-row{position:relative;display:flex;gap:32px;align-items:center}
.mc-art{position:relative;width:230px;height:152px;flex:none}
.vinyl{position:absolute;left:80px;top:6px;width:140px;height:140px;border-radius:50%;background:repeating-radial-gradient(circle,#2a2525 0 2px,#171414 2px 4px);box-shadow:0 10px 26px rgba(0,0,0,.35)}
.vinyl i{position:absolute;inset:44px;border-radius:50%;background:linear-gradient(145deg,#F6B75E,#E98555 52%,#C95B79)}
.vinyl i::after{content:"";position:absolute;inset:19px;border-radius:50%;background:#171414}
.cover{position:absolute;left:0;top:0;width:152px;height:152px;border-radius:30px;background:linear-gradient(145deg,#F6B75E,#E98555 52%,#C95B79);box-shadow:0 16px 34px rgba(201,91,121,.32);display:flex;align-items:center;justify-content:center}
.cover b{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;color:#fff}
.mc h3{font-size:38px;font-weight:700}
.mc .meta{font:21px "PT Mono",Menlo,monospace;color:#8A7B6E;margin-top:6px}
.tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;font-size:20px;color:var(--muted)}
.tags span{padding:5px 15px;border-radius:999px;background:rgba(67,53,43,.06)}
.tags span.ac{background:rgba(194,85,102,.14);color:var(--rose);font-weight:600}
.mc-player{display:flex;align-items:center;gap:22px;margin-top:26px;padding:18px 24px;border-radius:28px;background:#F8F6F3}
.mc-play{width:72px;height:72px;border-radius:50%;background:var(--rose);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.wave{flex:1;height:52px;display:flex;align-items:center;gap:4px}
.wave i{flex:1;border-radius:3px;background:rgba(67,53,43,.16)}
.wave i.on{background:var(--rose)}
.mc-time{font:19px "PT Mono",Menlo,monospace;color:#8A7B6E;white-space:nowrap}
.np{width:960px;border-radius:32px;background:rgba(255,255,255,.97);box-shadow:0 30px 80px rgba(0,0,0,.28);overflow:hidden;color:#1F2937}
.np-head{display:flex;align-items:center;gap:14px;padding:24px 28px 18px;white-space:nowrap}
.np-dot{position:relative;width:14px;height:14px;border-radius:50%;background:#3B82F6;flex:none}
.np-head b{font-size:26px;font-weight:600}
.np-head small{font-size:20px;color:#9CA3AF}
.np-chip{font-size:19px;padding:5px 14px;border-radius:999px;background:#EFF6FF;color:#2563EB;font-weight:600}
.np-chip.ok{background:#ECFDF5;color:#059669}
.np-stat{margin-left:auto;display:flex;gap:16px;font-size:21px;color:#4B5563}
.np-bar{height:6px;background:#F3F4F6}.np-bar i{display:block;height:100%;background:linear-gradient(90deg,#60A5FA,#2563EB)}
.np-steps{display:flex;justify-content:space-between;padding:22px 44px 4px}
.np-step{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:18px;color:#9CA3AF}
.np-step i{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#F3F4F6;font-style:normal;font-size:18px}
.np-step.done{color:#059669}.np-step.done i{background:#D1FAE5}
.np-step.cur{color:#2563EB;font-weight:600}.np-step.cur i{background:#EFF6FF;box-shadow:0 0 0 3px #93C5FD}
.np-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;padding:18px 28px 24px}
.np-grid i{aspect-ratio:1;border-radius:11px;background:#F3F4F6;display:flex;align-items:center;justify-content:center;font:600 19px "PT Mono",Menlo,monospace;color:#9CA3AF;font-style:normal}
.np-grid i.done{background:#34D399;color:#fff}
.np-grid i.cur{background:#DBEAFE;color:#2563EB;box-shadow:0 0 0 3px #60A5FA}
.trbox{width:880px;border-radius:32px;background:rgba(23,18,38,.97);box-shadow:0 0 0 1px rgba(196,181,253,.18),0 30px 80px rgba(0,0,0,.45);padding:30px 40px 34px;color:#EDE9FE;overflow:hidden}
.tr-q{font-size:25px;color:rgba(237,233,254,.9)}.tr-q span{color:rgba(196,181,253,.65);margin-right:12px}
.tr-s{font-size:20px;color:rgba(221,214,254,.45);margin-top:6px}
.tr-cards{display:flex;justify-content:center;gap:32px;margin-top:24px}
.tc{width:190px;text-align:center}
.tc-f{position:relative;width:190px;height:285px;perspective:1200px}
.tc-in{position:absolute;inset:0;transform-style:preserve-3d}
.tc-in>div{position:absolute;inset:0;border-radius:14px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 0 0 2px rgba(253,230,138,.35),0 14px 28px rgba(0,0,0,.45)}
.tc-in>div img{width:100%;height:100%;object-fit:cover}
.tc-in .fr{transform:rotateY(180deg)}
.tc b{display:block;margin-top:14px;font-size:22px;font-weight:500;color:rgba(254,243,199,.92)}
.tc small{font-size:18px;color:rgba(221,214,254,.5)}
.frc{width:680px;border-radius:30px;background:rgba(255,255,255,.95);box-shadow:0 26px 70px rgba(26,23,20,.22);padding:28px 34px;color:var(--text)}
.frc-h{display:flex;align-items:center;gap:10px;font-size:28px;font-weight:600;color:var(--accent-ink);margin-bottom:6px}
.frc-r{display:flex;gap:20px;padding:13px 0;border-bottom:1px solid rgba(67,53,43,.07);font-size:24px}
.frc-r span{width:136px;flex:none;color:#8A7B6E}
.frc-r b{font-weight:500}
.btn-ok{display:inline-flex;align-items:center;gap:10px;margin-top:18px;padding:12px 24px;border-radius:999px;background:rgba(143,162,122,.2);color:#5E7350;font-size:22px;font-weight:600}
.opc{width:980px;height:600px;border-radius:34px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.32);background-size:cover;background-position:center}
.opc-dim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,22,16,.1),rgba(30,22,16,.55))}
.opc-say{position:absolute;left:32px;top:28px;display:flex;gap:12px;align-items:center;padding:9px 22px 9px 9px;border-radius:999px;background:rgba(255,250,243,.88);font-size:22px;color:var(--text)}
.opc-say img{width:44px;height:44px;border-radius:50%;object-fit:cover}
.opc-card{position:absolute;left:32px;right:32px;bottom:32px;display:flex;gap:26px;padding:24px;border-radius:26px;background:rgba(255,250,243,.92);color:var(--text)}
.opc-card>img{width:186px;height:186px;border-radius:22px;object-fit:cover;flex:none}
.opc-card h4{font-size:42px;font-weight:900}
.opc-card .m{font-size:20px;color:#8A7B6E;margin-top:4px}
.opc-card .q{font-size:23px;margin-top:10px}
.opc-go{position:absolute;right:24px;bottom:24px;padding:12px 28px;border-radius:999px;background:var(--ink);color:#F3E6CC;font-size:22px;letter-spacing:.16em}
.opc-ok{position:absolute;left:50%;top:108px;transform:translateX(-50%);padding:12px 28px;border-radius:999px;background:rgba(143,162,122,.95);color:#fff;font-size:22px;white-space:nowrap}
.pc{width:760px;border-radius:30px;background:#fff;box-shadow:0 30px 80px rgba(26,23,20,.25);padding:26px 30px;color:var(--text)}
.pc-h{display:flex;align-items:center;gap:14px}
.pc-h img{width:60px;height:60px;border-radius:50%;object-fit:cover}
.pc-h b{display:block;font-size:26px}
.pc-h small{font-size:19px;color:#A3958A}
.pc-h em{margin-left:auto;font-style:normal;font-size:19px;padding:5px 14px;border-radius:999px;background:rgba(143,162,122,.16);color:#5E7350}
.pc p{font-size:24px;line-height:1.55;margin-top:14px}
.pc-img{margin-top:14px;height:300px;border-radius:18px;background-size:cover;background-position:center}
.pc-like{display:flex;align-items:center;gap:6px;margin-top:14px;padding:10px 16px 10px 26px;border-radius:16px 16px 0 0;background:#F6F3EE;font-size:21px;color:var(--accent-ink);height:62px}
.pc-like img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:3px solid #F6F3EE;margin-left:-12px}
.pc-cm{padding:6px 16px 12px;background:#F6F3EE;font-size:21px;line-height:1.45;border-radius:0 0 16px 16px}
.pc-cm b{color:var(--accent-ink);font-weight:600}
.tb{width:960px;height:600px;border-radius:30px;background-size:cover;background-position:center;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden}
.pol{position:absolute;background:#fff;padding:12px 12px 48px;box-shadow:0 14px 30px rgba(0,0,0,.3)}
.pol div{background-size:cover;background-position:center}
.pol i{position:absolute;width:110px;height:30px;background:rgba(255,248,225,.78);top:-14px;left:50%;margin-left:-55px;transform:rotate(-5deg)}
.tb-h{position:absolute;left:26px;top:22px;padding:9px 22px;border-radius:999px;background:rgba(255,255,255,.9);font-size:22px;color:var(--text);font-weight:600}
.call{width:560px;height:800px;border-radius:54px;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.5),0 0 0 9px #15120f}
.call-bg{position:absolute;inset:-50px;background-size:cover;background-position:center;filter:blur(22px) saturate(1.1)}
.call-dim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,16,12,.3),rgba(20,16,12,.62))}
.call-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:120px;color:#fff}
.call-av{position:relative;width:196px;height:196px}
.call-av img{position:relative;width:196px;height:196px;border-radius:50%;object-fit:cover;border:5px solid rgba(255,255,255,.85)}
.call-c h5{font-size:48px;font-weight:600;margin-top:34px}
.call-st{font-size:24px;opacity:.8;margin-top:10px}
.call-pill{margin-top:26px;padding:12px 26px;border-radius:999px;background:rgba(255,255,255,.18);font-size:22px}
.call-wave{display:flex;gap:8px;align-items:center;height:80px;margin-top:24px}
.call-wave i{width:8px;border-radius:4px;background:rgba(255,255,255,.9)}
.call-btns{position:absolute;left:0;right:0;bottom:72px;display:flex;justify-content:space-around;padding:0 36px}
.call-b{display:flex;flex-direction:column;align-items:center;gap:12px;font-size:20px;color:#fff}
.call-b i{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center}
/* 杂志式信息框：差值混合，任何底色上都看得清 */
.hud{position:absolute;inset:0;z-index:55;pointer-events:none;mix-blend-mode:difference;color:#fff;font:600 22px/1 "PT Mono",Menlo,monospace;letter-spacing:.16em}
.hud>div{position:absolute;white-space:nowrap}
.hud .tl{left:64px;top:52px}.hud .tr{right:64px;top:52px}.hud .bl{left:64px;bottom:52px}.hud .br{right:64px;bottom:52px;display:flex;gap:10px;align-items:center}
.hud .br i{width:16px;height:16px;border:2px solid #fff;display:block}.hud .br i.on{background:#fff}
.hud .k{width:34px;height:34px;border:0 solid #fff}
.hud .k1{left:28px;top:28px;border-left-width:3px;border-top-width:3px}.hud .k2{right:28px;top:28px;border-right-width:3px;border-top-width:3px}
.hud .k3{left:28px;bottom:28px;border-left-width:3px;border-bottom-width:3px}.hud .k4{right:28px;bottom:28px;border-right-width:3px;border-bottom-width:3px}
/* 字幕 */
.caption{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);padding:14px 34px;border-radius:40px;background:rgba(26,23,20,.72);color:rgba(250,250,247,.55);font-size:40px;white-space:nowrap;z-index:56;transition:opacity .12s;pointer-events:none}
.caption i{font-style:normal}.caption i.on{color:#F3DDB0}
.debug{position:absolute;left:16px;top:90px;z-index:70;font:24px/1.3 Menlo,monospace;color:#fff;background:#000a;padding:6px 12px;border-radius:8px;display:none}
/* 控制条 */
.controls{width:min(100%,calc((100svh - 100px)*16/9));display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:#d8d2c6}
.controls button{background:#2a2622;border:1px solid #47413a;border-radius:999px;padding:9px 18px;color:#eee8dc;cursor:pointer}
.controls button:hover{background:#3a342e}
.controls button:disabled{opacity:.5;cursor:wait}
.controls button[aria-pressed="false"]{color:#8d867b}
#play{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:700;min-width:96px}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#seek{flex:1;min-width:120px;accent-color:var(--rose)}
#time{font:13px Menlo,monospace;white-space:nowrap}

    const fall = prog(t, o.t - 0.32, 0.32), y = t < o.t ? lerp(-160, sy0, eIn(fall)) : sy0;
    const land = prog(t, o.t, 0.18), q = t >= o.t ? 1 - Math.sin(land * Math.PI) * 0.22 : 1;
    const spin = t >= 43.16 ? (t - 43.16) * 0.8 : 0;
    const fx = last ? sx0 : 960 + Math.cos(ang + spin) * R, fy = last ? y + (caught ? (1 - sy) * 760 : 0) : t >= o.t ? 660 + Math.sin(ang + spin) * R : y;

  drawRise(c.hs, t, 43.5, cx, 560);
  place(c.end, 1360, 540, 1, 0, endP);

/* 杂志式信息框、字幕、调试信息 */
const hud = h(canvas, 'hud', '', '<div class="k k1"></div><div class="k k2"></div><div class="k k3"></div><div class="k k4"></div><div class="tl">ALICE.FANS</div><div class="tr">N°01 · 当然可以，好问题</div><div class="bl">TC 00:00.00</div><div class="br"><i></i><i></i><i></i><i></i><span>&nbsp;150 BPM</span></div>');
const hudTC = hud.querySelector('.bl'), hudBeats = [...hud.querySelectorAll('.br i')];
const caption = h(canvas, 'caption song');
const debug = h(canvas, 'debug');
let capLine = -1, captionsOn = params.get('captions') === '1';
function drawCaption(t) {
  let li = -1;
  LYRICS.forEach((l, i) => { if (t >= l.w[0][0] - 0.1 && t < l.end) li = i; });
  const show = captionsOn && li >= 0 && t < 43.4;
  caption.style.opacity = show ? 1 : 0;
  if (li < 0) return;
  if (li !== capLine) { capLine = li; caption.innerHTML = LYRICS[li].w.map(([, w]) => `<i>${w}</i>`).join(''); }
  [...caption.children].forEach((e, i) => e.classList.toggle('on', t >= LYRICS[li].w[i][0]));
}

const audio = document.getElementById('audio');
const $ = id => document.getElementById(id);
const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
let raf = 0, current = '';
function render(t = audio.currentTime || 0) {
  for (const s of scenes) {
    const on = t >= s.a && t < s.b;
    s.el.style.display = on ? 'block' : 'none';
    if (!on) continue;
    s.draw(t, s.ctx, s.el);
    current = s.id;
  }
  if (t < 0) scenes[0].el.style.display = 'block';
  const tc = Math.max(0, t);
  hudTC.textContent = `TC 00:${String(Math.floor(tc)).padStart(2, '0')}.${String(Math.floor((tc % 1) * 100)).padStart(2, '0')}`;
  const bi = beatIndex(t);
  hudBeats.forEach((e, i) => e.classList.toggle('on', ((bi % 4) + 4) % 4 === i));
  hud.style.opacity = t >= 43.4 ? 1 - prog(t, 43.4, 0.3) : 1;
  drawCaption(t);
  if (params.has('debug')) { debug.style.display = 'block'; debug.textContent = t.toFixed(2) + 's · ' + current; }
  const d = Number.isFinite(audio.duration) ? audio.duration : DURATION;
  $('seek').value = t;
  $('time').textContent = fmt(t) + ' / ' + fmt(d);
}
function tick() { render(); if (!audio.paused) raf = requestAnimationFrame(tick); }

const frame = $('frame');
function fit() {
  const k = frame.clientWidth / 1920, kh = frame.clientHeight / 1080, s = Math.min(k, kh);
  canvas.style.transform = `translate(${(frame.clientWidth - 1920 * s) / 2}px,${(frame.clientHeight - 1080 * s) / 2}px) scale(${s})`;
}
new ResizeObserver(fit).observe(frame);
fit();

function preload() {
  const list = [...Object.keys(META[outfit]).map(p => `sprites/${outfit}/alice_${p}.svg`), IMG.icon, ...FRIENDS.map(f => IMG.friend(f[0])), ...FRIENDS.slice(0, 12).map(f => IMG.life(f[0])), ...DAY.map(d => IMG.scene(d[1])), P + 'card/ferry.webp', P + 'card/lujianchuan.webp', IMG.scene('cafe'), IMG.scene('board'), IMG.scene('life_sofa_phone'), IMG.scene('life_shanghai_wukang_autumn'), P + 'tarot/card_back.webp', ...TAROT.map(o => P + `tarot/${o[0]}.webp`)];
  let done = 0, failed = 0;
  return Promise.race([
    Promise.all(list.map(src => new Promise(res => {
      const i = new Image();
      i.onload = () => { done++; $('play').textContent = `加载 ${Math.round(done / list.length * 100)}%`; res(); };
      i.onerror = () => { failed++; res(); };
      i.src = src;
    }))),
    new Promise(res => setTimeout(res, 12000)),
  ]).then(() => failed);
}

$('play').onclick = async () => {
  if (!audio.paused) { audio.pause(); return; }
  try { if (audio.ended || audio.currentTime >= DURATION - 0.05) audio.currentTime = 0; await audio.play(); }
  catch (e) { $('status').textContent = '无法播放音频：' + (e && e.message ? e.message : '浏览器拒绝了播放请求'); $('load').hidden = false; }
};
audio.addEventListener('play', () => { cancelAnimationFrame(raf); $('play').textContent = '暂停'; tick(); });
audio.addEventListener('pause', () => { cancelAnimationFrame(raf); $('play').textContent = '播放'; render(); });
audio.addEventListener('ended', () => { $('play').textContent = '重播'; render(DURATION); });
audio.addEventListener('loadedmetadata', () => { if (Number.isFinite(audio.duration)) $('seek').max = audio.duration; render(); });
audio.addEventListener('seeked', () => render());
audio.addEventListener('error', () => { $('status').textContent = '没有找到 assets/song.mp3，可以点「导入音频」手动选择歌曲。'; $('load').hidden = false; });
$('seek').oninput = () => { audio.currentTime = Number($('seek').value); render(Number($('seek').value)); };
$('cc').onclick = () => { captionsOn = !captionsOn; $('cc').setAttribute('aria-pressed', String(captionsOn)); render(); };
$('fs').onclick = async () => {
  try { if (document.fullscreenElement) await document.exitFullscreen(); else await frame.requestFullscreen(); }
  catch (e) { $('status').textContent = '当前浏览器不支持页面全屏，请使用浏览器自带的全屏。'; }
};
/* 换装：按 OUTFIT_NAMES 顺序轮换，地址栏同步 ?outfit=，刷新后保持；没有对应动作的衣服用 FALLBACK 代替 */
$('outfit').onclick = () => {
  const keys = Object.keys(OUTFIT_NAMES).filter(k => META[k]);
  outfit = keys[(keys.indexOf(outfit) + 1) % keys.length];
  params.set('outfit', outfit);
  history.replaceState(null, '', '?' + params.toString());
  $('outfit').textContent = '换装：' + OUTFIT_NAMES[outfit];
  ACTORS.forEach(b => b.set(b.want));
  render();
};
$('load').onclick = () => $('file').click();
let blobUrl = null;
$('file').onchange = () => {
  const f = $('file').files[0];
  if (!f) return;
  audio.pause();
  if (blobUrl) URL.revokeObjectURL(blobUrl);
  blobUrl = URL.createObjectURL(f);
  audio.src = blobUrl; audio.load();
  $('status').textContent = '已导入：' + f.name;
};
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
  if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { e.preventDefault(); audio.currentTime = clamp(audio.currentTime + (e.code === 'ArrowRight' ? 1 : -1), 0, DURATION); render(); }
});
$('outfit').textContent = '换装：' + OUTFIT_NAMES[outfit];
$('cc').setAttribute('aria-pressed', String(captionsOn));
if (params.get('embed') === '1') document.body.classList.add('embed');

if (!window.SPRITE_META) $('status').textContent = '没有找到 sprites/sprites.js，像素 Alice 无法显示。';
preload().then(failed => {
  $('play').disabled = false;
  $('play').textContent = '播放';
  if (failed) $('status').textContent = `有 ${failed} 张图片没有加载成功，画面会缺图，请检查 assets 与 sprites 目录。`;
  const freeze = params.get('t');
  const go = () => { render(freeze === null ? 0 : Number(freeze)); document.body.dataset.ready = '1'; };
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(go));
});
render(0);
</script>
